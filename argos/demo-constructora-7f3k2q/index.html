function acAddRow(){acNew.rows.push({codigo:'',articulo:'',cant:'',precio:''});acRowsRender();}
function acDelRow(i){acNew.rows.splice(i,1);acRowsRender();}
function acRowsRender(){const el=document.getElementById('ac-rows');if(!el)return;
  setHTML(el,acNew.rows.map(function(r,i){return '<div style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px">'+
    '<div class="field" style="margin-bottom:6px"><input id="ac-art-'+i+'" placeholder="'+(LISTA?'Busca por codigo o nombre en la lista...':'Articulo')+'" value="'+esc(r.articulo)+'" autocomplete="off" oninput="acNew.rows['+i+'].articulo=this.value;acNew.rows['+i+'].codigo=\'\'"></div>'+
    '<div style="display:flex;gap:8px;align-items:flex-end">'+
      '<div class="field" style="flex:1;margin:0"><label>Cantidad</label><input id="ac-cant-'+i+'" inputmode="decimal" placeholder="0" value="'+esc(r.cant)+'" oninput="acSync('+i+')"></div>'+
      '<div class="field" style="flex:1;margin:0"><label>Precio unit.</label><input id="ac-pre-'+i+'" inputmode="decimal" placeholder="0" value="'+esc(r.precio)+'" oninput="acSync('+i+')"></div>'+
      '<div style="flex:1;text-align:right;padding-bottom:8px"><div class="muted" style="font-size:11px">Importe</div><b id="ac-imp-'+i+'" class="num">-</b></div>'+
      '<button class="btn ghost sm danger" style="margin-bottom:4px" onclick="acDelRow('+i+')">x</button></div></div>';}).join(''));
  acNew.rows.forEach(function(r,i){sugiere('ac-art-'+i,lpDisp,function(){acPick(i);});acImp(i);});
  acTotalCalc();}
function acPick(i){const inp=document.getElementById('ac-art-'+i);const cod=(inp.value.split(' - ')[0]||'').trim();const it=lpFind(cod);
  if(it){const r=acNew.rows[i];r.codigo=it.codigo;r.articulo=it.codigo+' - '+it.articulo;r.precio=fmtImp(it.precio);
    const p=document.getElementById('ac-pre-'+i);if(p)p.value=r.precio;
    const c=document.getElementById('ac-cant-'+i);if(c)c.focus();}
  acSync(i);}
function acSync(i){const r=acNew.rows[i];if(!r)return;
  const c=document.getElementById('ac-cant-'+i),p=document.getElementById('ac-pre-'+i);
  if(c)r.cant=c.value;if(p)r.precio=p.value;acImp(i);acTotalCalc();}
function acImp(i){const r=acNew.rows[i];const el=document.getElementById('ac-imp-'+i);if(!el)return;
  const imp=num(r.cant)*num(r.precio);el.textContent=imp>0?money(imp):'-';}
function acTotalCalc(){const tot=acNew.rows.reduce((s,r)=>s+num(r.cant)*num(r.precio),0);
  const t=document.getElementById('ac-total'),h=document.getElementById('ac-tot-hint');if(!t)return;
  if(tot>0){t.value=fmtImp(tot);t.readOnly=true;if(h)h.textContent='Total = suma de los articulos.';}
  else{t.readOnly=false;if(h)h.textContent='Sin articulos: carga el total a mano.';}}
function saveAcopio(){const msg=document.getElementById('ac-msg');
  const prov=codigoDesdeInput(document.getElementById('ac-prov').value);const fecha=document.getElementById('ac-fecha').value;
  const err=t=>{msg.className='form-msg show';msg.textContent=t;};
  if(!prov||!fecha)return err('Falta proveedor o fecha');
  const items=[];
  for(let i=0;i<acNew.rows.length;i++){const r=acNew.rows[i];
    const art=(r.articulo||'').trim(),cant=num(r.cant),precio=num(r.precio);
    if(!art&&!cant&&!precio)continue; // renglon vacio: se ignora
    if(!art||cant<=0||precio<=0)return err('Renglon '+(i+1)+': falta articulo, cantidad o precio (o sacalo con la x)');
    let nomArt=art;if(r.codigo&&art.indexOf(r.codigo+' - ')===0)nomArt=art.slice((r.codigo+' - ').length);
    const k=r.codigo||normTxt(nomArt);const ya=items.find(x=>itKey(x)===k);
    if(ya)ya.cant+=cant;else items.push({codigo:r.codigo||'',articulo:nomArt,cant:cant,precio:precio});}
  const total=items.length?items.reduce((s,x)=>s+x.cant*x.precio,0):num(document.getElementById('ac-total').value);
  if(!total)return err('Falta el total del acopio (carga articulos o el monto a mano)');
  S.acopios.unshift({id:uid(),proveedor:prov,fecha:fecha,total:total,detalle:document.getElementById('ac-det').value.trim(),items:items,descuentos:[]});
  save();closePanel();render();toast('Acopio cargado');}
let daNew=null;

  const its=a.items||[];
  if(!its.length){ // acopio viejo solo-plata: form simple como siempre
    openPanel('<div class="panel-head"><h2>Desacopio</h2><div class="spacer"></div><button class="btn ghost sm" onclick="closePanel()">x</button></div>'+
    '<div class="panel-body"><div class="form-msg" id="da-msg"></div>'+
      '<div class="banner" style="margin-bottom:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg><div>Acopio de <b>'+esc(nombrePorCodigo(a.proveedor)||a.proveedor)+'</b>: queda <b>'+money(saldoAcopio(a))+'</b>.</div></div>'+
      '<div class="row2"><div class="field"><label>Fecha <span class="req">*</span></label><input type="date" id="da-fecha" value="'+ultimaFecha()+'"></div>'+
        '<div class="field"><label>N remito <span class="req">*</span></label><input id="da-rem" placeholder="R-0001-00012345"></div></div>'+
      '<div class="row2"><div class="field"><label>Monto <span class="req">*</span></label><input id="da-monto" inputmode="decimal" placeholder="0"></div>'+
        '<div class="field"><label>Detalle</label><input id="da-det" placeholder="Que se retiro"></div></div>'+
      '<button class="btn primary" style="width:100%" onclick="saveDesacopio(\''+a.id+'\')">Descontar del acopio</button></div>');return;}
  daNew={aid:id,rows:[]};
  openPanel('<div class="panel-head"><h2>Desacopio por remito</h2><div class="spacer"></div><button class="btn ghost sm" onclick="closePanel()">x</button></div>'+
  '<div class="panel-body"><div class="form-msg" id="da-msg"></div>'+
    '<div class="banner" style="margin-bottom:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg><div>Acopio de <b>'+esc(nombrePorCodigo(a.proveedor)||a.proveedor)+'</b>: queda <b>'+money(saldoAcopio(a))+'</b>. Los precios son los del acopio (congelados).</div></div>'+
    '<div class="row2"><div class="field"><label>Fecha <span class="req">*</span></label><input type="date" id="da-fecha" value="'+ultimaFecha()+'"></div>'+
      '<div class="field"><label>N remito <span class="req">*</span></label><input id="da-rem" placeholder="R-0001-00012345"></div></div>'+
    '<div class="field"><label>Que se retiro <span class="req">*</span></label><div id="da-rows"></div>'+
      '<button class="btn ghost sm" onclick="daAddRow()">+ Agregar articulo</button></div>'+
    '<div class="field"><label>Detalle</label><input id="da-det" placeholder="Observaciones (opcional)"></div>'+
    '<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><div>Total del remito: <b id="da-total" class="num">-</b></div></div>'+
    '<button class="btn primary" style="width:100%" onclick="saveDesacopio(\''+a.id+'\')">Descontar del acopio</button></div>');
  daAddRow();}
function daDisponible(a,k,skipRow){let d=0;const it=(a.items||[]).find(x=>itKey(x)===k);if(!it)return 0;
  d=it.cant-acRetirado(a,k);
  daNew.rows.forEach(function(r,j){if(j!==skipRow&&r.k===k)d-=num(r.cant);});
  return d;}
function daAddRow(){daNew.rows.push({k:'',cant:''});daRowsRender();}
function daDelRow(i){daNew.rows.splice(i,1);daRowsRender();}
function daRowsRender(){const a=S.acopios.find(x=>x.id===daNew.aid);if(!a)return;
  const el=document.getElementById('da-rows');if(!el)return;
  setHTML(el,daNew.rows.map(function(r,i){
    const opts='<option value="">Elegi articulo...</option>'+(a.items||[]).map(function(it){const k=itKey(it);const disp=it.cant-acRetirado(a,k);
      if(disp<=0&&r.k!==k)return '';
      return '<option value="'+esc(k)+'"'+(r.k===k?' selected':'')+'>'+esc((it.codigo?it.codigo+' - ':'')+it.articulo)+' (quedan '+fmtCant(disp)+')</option>';}).join('');
    return '<div style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px">'+
    '<div class="field" style="margin-bottom:6px"><select id="da-art-'+i+'" onchange="daSel('+i+')">'+opts+'</select></div>'+
    '<div style="display:flex;gap:8px;align-items:flex-end">'+
      '<div class="field" style="flex:1;margin:0"><label>Cantidad</label><input id="da-cant-'+i+'" inputmode="decimal" placeholder="0" value="'+esc(r.cant)+'" oninput="daSync('+i+')"></div>'+
      '<div style="flex:1;text-align:right;padding-bottom:8px"><div class="muted" style="font-size:11px">Importe</div><b id="da-imp-'+i+'" class="num">-</b></div>'+
      '<button class="btn ghost sm danger" style="margin-bottom:4px" onclick="daDelRow('+i+')">x</button></div></div>';}).join(''));
  daNew.rows.forEach(function(r,i){daImp(i);});daTot();}
function daSel(i){const s=document.getElementById('da-art-'+i);daNew.rows[i].k=s?s.value:'';daImp(i);daTot();}
function daSync(i){const c=document.getElementById('da-cant-'+i);if(c)daNew.rows[i].cant=c.value;daImp(i);daTot();}
function daImp(i){const a=S.acopios.find(x=>x.id===daNew.aid);const r=daNew.rows[i];const el=document.getElementById('da-imp-'+i);if(!el||!a)return;
  const it=(a.items||[]).find(x=>itKey(x)===r.k);const imp=it?num(r.cant)*it.precio:0;
  el.textContent=imp>0?money(imp):'-';}
function daTot(){const a=S.acopios.find(x=>x.id===daNew.aid);const el=document.getElementById('da-total');if(!el||!a)return;
  const tot=daNew.rows.reduce(function(s,r){const it=(a.items||[]).find(x=>itKey(x)===r.k);return s+(it?num(r.cant)*it.precio:0);},0);
  el.textContent=tot>0?money(tot):'-';}
function saveDesacopio(id){const a=S.acopios.find(x=>x.id===id);if(!a)return;
  const msg=document.getElementById('da-msg');const err=t=>{msg.className='form-msg show';msg.textContent=t;};
  const fecha=document.getElementById('da-fecha').value,rem=document.getElementById('da-rem').value.trim();
  if(!fecha||!rem)return err('Falta fecha o numero de remito');
  const its=a.items||[];
  if(!its.length){ // acopio viejo solo-plata
    const monto=num(document.getElementById('da-monto').value);
    if(!monto)return err('Falta el monto');
    a.descuentos.push({fecha:fecha,remito:rem,monto:monto,detalle:document.getElementById('da-det').value.trim()});
    save();closePanel();render();toast('Desacopio registrado, saldo actualizado');return;}
  const items=[];
  for(let i=0;i<daNew.rows.length;i++){const r=daNew.rows[i];const cant=num(r.cant);
    if(!r.k&&!cant)continue;
    if(!r.k||cant<=0)return err('Renglon '+(i+1)+': falta articulo o cantidad (o sacalo con la x)');
    const it=its.find(x=>itKey(x)===r.k);if(!it)return err('Renglon '+(i+1)+': articulo invalido');
    if(items.find(x=>itKey(x)===r.k))return err('El articulo "'+it.articulo+'" esta en dos renglones, unificalo');
    const disp=it.cant-acRetirado(a,r.k);
    if(cant>disp+0.001)return err('De "'+it.articulo+'" quedan '+fmtCant(disp)+', no se puede retirar '+fmtCant(cant));
    items.push({codigo:it.codigo,articulo:it.articulo,cant:cant,precio:it.precio});}
  if(!items.length)return err('Carga al menos un articulo del remito');
  const monto=items.reduce((s,x)=>s+x.cant*x.precio,0);
  a.descuentos.push({fecha:fecha,remito:rem,monto:monto,detalle:document.getElementById('da-det').value.trim(),items:items});
  save();closePanel();render();toast('Desacopio registrado: producto y plata descontados');}

// ---- Obras y certificados a cobrar, ajustado por CAC ----
function cacFactor(o){const base=o.cacBase||S.cac.base||1;return (S.cac.actual||base)/base;}
// Los certificados A ahora salen de las facturas de venta: cada factura de venta cuya obra
// coincide con el codigo de la obra aparece como certificado A (una sola carga). Los Z y los
// A viejos cargados a mano siguen viviendo en o.certificados.
function facturasDeObra(o){return (S.ventas||[]).filter(v=>v.obra&&String(v.obra)===String(o.codigo));}
function saldoFac(v){return Math.max(0,(v.importe||0)-(v.cobrado?(v.importe||0):(v.cobradoMonto||0)));}
function facPend(o){return facturasDeObra(o).reduce((a,v)=>a+saldoFac(v),0);}                          // real, sin CAC
function manualAPend(o){return o.certificados.filter(c=>!c.cobrado&&c.tipo==='A').reduce((a,c)=>a+c.monto,0);} // A viejo a mano
function pendObra(o){return facPend(o)+manualAPend(o);}                                                // nominal (A), sin Z
function pendObraAjust(o){return facPend(o)+Math.round(manualAPend(o)*cacFactor(o));}                  // fac real + A viejo ajustado CAC
function certsPendObra(o){return facturasDeObra(o).filter(v=>!v.cobrado).length+o.certificados.filter(c=>!c.cobrado&&c.tipo==='A').length;}
// Filas unificadas de la obra: facturas de venta (A) + A viejos a mano + Z (si el rol los ve)
function rowsObra(o,verZ){const f=cacFactor(o);const rows=[];
  facturasDeObra(o).forEach(v=>rows.push({num:v.numero,tipoLbl:'A',origen:'factura',mes:(v.fecha||'').slice(0,7),
    nominal:v.importe||0,ajust:v.importe||0,cobrado:!!v.cobrado,parcial:(v.cobradoMonto||0)>0&&!v.cobrado,saldo:saldoFac(v),
    onCobrar:"openCobranza('"+v.id+"')"}));
  o.certificados.filter(c=>c.tipo==='A').forEach(c=>rows.push({num:c.numero,tipoLbl:'A',origen:'mano',mes:c.mes,
    nominal:c.monto,ajust:Math.round(c.monto*f),cobrado:!!c.cobrado,parcial:false,saldo:c.monto,
    onCobrar:"cobrarCert('"+o.id+"','"+c.id+"')"}));
  if(verZ)o.certificados.filter(c=>c.tipo==='Z').forEach(c=>rows.push({num:c.numero,tipoLbl:'Z',origen:'Z',mes:c.mes,
    nominal:c.monto,ajust:null,cobrado:!!c.cobrado,parcial:(c.cobradoMonto||0)>0&&!c.cobrado,saldo:c.monto-(c.cobradoMonto||0),
    onCobrar:"openCobroZ('"+o.id+"','"+c.id+"')"}));
  return rows;}
function chipOrigen(r){return r.origen==='factura'?' <span class="chip" style="font-size:10px;padding:1px 6px">Factura</span>':
  r.origen==='mano'?' <span class="chip" style="font-size:10px;padding:1px 6px;opacity:.7">a mano</span>':
  ' <span class="chip neg" style="font-size:10px;padding:1px 6px">Z</span>';}
function setCacActual(){S.cac.actual=num(document.getElementById('cac-actual').value)||S.cac.actual;save();renderObras();toast('Indice CAC actualizado, montos recalculados');}
function renderObras(){const el=document.getElementById('obras-body');if(!el)return;const admin=ROLES[S.role].all;
  const verZ=false; // Certificados Z, Caja M y Metros retirados definitivo (pedido Direccion 04/09): parte contable solo A.
  const totalAjust=S.obras.reduce((a,o)=>a+pendObraAjust(o),0);
  const totalNom=S.obras.reduce((a,o)=>a+pendObra(o),0);
  let html='<div class="tiles"><div class="tile total"><div class="lbl">Total a cobrar</div><div class="val num">'+money(totalAjust)+'</div><div class="meta">nominal '+money(totalNom)+' - A viejos ajustados por CAC '+(S.cac.actual)+'</div></div>'+
    '<div class="tile"><div class="lbl">Obras activas</div><div class="val num">'+S.obras.length+'</div></div>'+
    '<div class="tile"><div class="lbl">Certificados A pendientes</div><div class="val num">'+S.obras.reduce((a,o)=>a+certsPendObra(o),0)+'</div></div></div>';
  html+=S.obras.map(o=>{const f=cacFactor(o);const rows=rowsObra(o,verZ);
    return '<div class="card" style="margin-bottom:16px"><div class="card-head"><h2>'+esc(o.nombre)+'</h2>'+
      '<div class="sub">Obra '+esc(o.codigo)+' - '+esc(o.cliente||'')+' - CAC base '+o.cacBase+' (x'+f.toFixed(3)+')</div><div class="spacer"></div>'+
      '<span class="chip warn">A cobrar '+money(pendObraAjust(o))+'</span>'+
      (verZ?'<button class="btn sm" onclick="openCert(\''+o.id+'\')">+ Certificado Z</button>':'')+'</div>'+
      (rows.length?(IS_MOBILE()?'<div class="mlist">'+rows.map(r=>
        mrow('Cert '+esc(r.num)+chipOrigen(r),esc(r.mes),r.cobrado?'':(r.parcial?'queda '+money(r.saldo):'nominal '+money(r.nominal)),
          '<div class="ma">'+(r.cobrado?'<span class="chip pos">Cobrado</span>':money(r.tipoLbl==='Z'?r.nominal:(r.ajust||r.nominal)))+'</div>'+
          '<div class="ms">'+(r.cobrado?'':(admin?'<button class="btn sm" onclick="'+r.onCobrar+'">Cobrar</button>':'por cobrar'))+'</div>')).join('')+'</div>'
      :'<div class="tbl-wrap"><table><thead><tr><th>Certificado</th><th>Mes</th><th class="r">Monto nominal</th><th class="r">Ajustado CAC</th><th>Estado</th>'+(admin?'<th></th>':'')+'</tr></thead><tbody>'+
      rows.map(r=>{
        return '<tr><td><span class="codebox">'+esc(r.num)+'</span>'+chipOrigen(r)+'</td><td class="num muted">'+esc(r.mes)+'</td>'+
        '<td class="r num muted">'+money(r.nominal)+'</td><td class="r num">'+(r.cobrado?'<span class="muted">-</span>':(r.ajust==null?'<span class="muted">s/ajuste</span>':money(r.ajust)))+'</td>'+
        '<td>'+(r.cobrado?'<span class="chip pos">Cobrado</span>':(r.parcial?'<span class="chip warn">Parcial - queda '+money(r.saldo)+'</span>':'<span class="chip warn">Por cobrar</span>'))+'</td>'+
        (admin?'<td class="r">'+(r.cobrado?'':'<button class="btn sm" onclick="'+r.onCobrar+'">Registrar cobro</button>')+'</td>':'')+'</tr>';}).join('')+
      '</tbody></table></div>'):'<div class="empty">Sin certificados. Los A entran solos al cargar la factura de venta con esta obra'+(verZ?'; los Z se cargan con el boton de arriba.':'.')+'</div>')+'</div>';}).join('')||'<div class="empty">Sin obras cargadas.</div>';
  setHTML(el,html);}
// Igual que facturas: el boton abre el formulario de Movimientos con el cobro precargado
// (ajustado por CAC). Guardar el movimiento pone el certificado en Cobrado; anularlo lo revierte.
function cobrarCert(obraId,certId){const o=S.obras.find(x=>x.id===obraId);if(!o)return;const c=o.certificados.find(x=>x.id===certId);if(!c)return;
  const f=cacFactor(o);const cobro=Math.round(c.monto*f);
  openMovimiento(null,null,{titulo:'Registrar cobro de certificado',signo:'ingreso',medio:'Banco Galicia',
    concepto:'Cobro certificado '+c.numero+' - '+o.nombre,monto:cobro,rubro:'INGRESOS',obra:o.codigo,codigo:o.codigo,cert:certId,
    nota:'<b>Cobro del certificado '+esc(c.numero)+'</b> de '+esc(o.nombre)+': nominal '+money(c.monto)+', ajustado CAC '+money(cobro)+'. Al guardar, el certificado pasa solo a Cobrado y se descuenta de lo pendiente de la obra. Si te equivocaste, anula el movimiento y vuelve a Por cobrar.'});}
function openObra(){openPanel('<div class="panel-head"><h2>Nueva obra</h2><div class="spacer"></div><button class="btn ghost sm" onclick="closePanel()">x</button></div>'+
  '<div class="panel-body"><div class="form-msg" id="ob-msg"></div>'+

let _xlsxP=null;
function ensureXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);if(_xlsxP)return _xlsxP;
  _xlsxP=new Promise((res,rej)=>{const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('carga'));document.head.appendChild(s);});
  return _xlsxP;}
function normNom(s){return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/#/g,'N').replace(/\s+/g,' ').trim().toUpperCase();}
// Lee filas [{cuenta,nombre,importe,concepto}] de una matriz, tolerando encabezado y orden de columnas
function parseQuincenaAOA(aoa){
  if(!aoa.length)return [];
  let hi=-1;
  for(let i=0;i<Math.min(3,aoa.length);i++){const r=(aoa[i]||[]).map(c=>normNom(c));
    if(r.some(c=>c.indexOf('NOMBRE')>=0)&&r.some(c=>c.indexOf('IMPORTE')>=0)){hi=i;break;}}
  let ci={cuenta:0,nombre:1,importe:2,concepto:3},start=0;
  if(hi>=0){const hdr=aoa[hi].map(c=>normNom(c));
    const find=(...keys)=>{for(const k of keys){const idx=hdr.findIndex(h=>h.indexOf(k)>=0);if(idx>=0)return idx;}return -1;};
    const c1=find('CUENTA','CBU'),c2=find('NOMBRE','APELLIDO'),c3=find('IMPORTE','MONTO'),c4=find('CONCEPTO');
    ci={cuenta:c1>=0?c1:0,nombre:c2>=0?c2:1,importe:c3>=0?c3:2,concepto:c4>=0?c4:3};start=hi+1;}
  const out=[];
  for(let i=start;i<aoa.length;i++){const r=aoa[i]||[];const nombre=(r[ci.nombre]!=null?String(r[ci.nombre]):'').trim();
    if(!nombre)continue;
    const impRaw=r[ci.importe];const importe=typeof impRaw==='number'?impRaw:num(String(impRaw||''));
    out.push({cuenta:(r[ci.cuenta]!=null?String(r[ci.cuenta]):'').trim(),nombre:nombre,importe:importe,concepto:(r[ci.concepto]!=null?String(r[ci.concepto]):'').trim()});}
  return out;}
let qImport=null;
function importarQuincena(input){const file=input.files&&input.files[0];if(!file)return;input.value='';
  const done=filas=>{qImport={filas:filas,fecha:ultimaFecha()};if(!filas.length){toast('No se encontraron filas en el archivo');return;}abrirPreviewQuincena();};
  if(/\.csv$/i.test(file.name)){const rd=new FileReader();rd.onload=e=>{const aoa=String(e.target.result).split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/[;\t,]/));done(parseQuincenaAOA(aoa));};rd.readAsText(file);return;}
  toast('Leyendo Excel...');
  ensureXLSX().then(XLSX=>{const rd=new FileReader();rd.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
    done(parseQuincenaAOA(XLSX.utils.sheet_to_json(ws,{header:1,raw:true})));}catch(err){toast('No se pudo leer el Excel');}};rd.readAsArrayBuffer(file);})
    .catch(()=>toast('No se pudo cargar el lector de Excel (revisa la conexion a internet)'));}
function matchEmpleado(nombre){const n=normNom(nombre);return S.empleados.find(e=>normNom(e.nombre)===n);}

    '<div id="qe-prev" class="hint"></div>'+
    '<div style="display:flex;gap:10px;margin-top:12px"><button class="btn primary" style="flex:1" onclick="bajarExcelBanco()">Descargar Excel</button>'+
    '<button class="btn ghost" onclick="closePanel()">Cancelar</button></div></div>');
  previewExportBanco();}
function filasExportBanco(){const d1=(document.getElementById('qe-d1')||{}).value||'';const d2=(document.getElementById('qe-d2')||{}).value||'';
  return S.empleados.map(e=>{const tot=pagosDe(e.legajo).filter(m=>enRango(m.fecha,d1,d2)).reduce((a,m)=>a+m.monto,0);
    return {cuenta:e.cuenta||'',nombre:e.nombre,importe:tot};}).filter(r=>r.importe>0);}
function previewExportBanco(){const rows=filasExportBanco();const sinCta=rows.filter(r=>!r.cuenta).length;const el=document.getElementById('qe-prev');
  if(el)setHTML(el,rows.length+' empleados con pagos en el rango, total '+money(rows.reduce((a,r)=>a+r.importe,0))+(sinCta?'. <b>'+sinCta+' sin cuenta cargada</b> (completala en el padron para que el banco pueda transferir).':'.'));}
function bajarExcelBanco(){const conc=(document.getElementById('qe-conc')||{}).value||'1';const rows=filasExportBanco();
  if(!rows.length){toast('No hay pagos en ese rango');return;}
  const aoa=[['Cuenta','Nombre','Importe','Concepto']].concat(rows.map(r=>[r.cuenta,r.nombre,r.importe,conc]));
  ensureXLSX().then(XLSX=>{const ws=XLSX.utils.aoa_to_sheet(aoa);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Empleados');
    XLSX.writeFile(wb,'transferencias-quincena.xlsx');toast('Excel descargado');})
    .catch(()=>toast('No se pudo cargar el generador de Excel (revisa la conexion a internet)'));}

const CAT_LABEL={1:'Ayudante',2:'Medio oficial',3:'Oficial'};
function pagosDe(leg){const L=String(leg).trim();return S.movimientos.filter(m=>movActivo(m)&&m.rubro==='SUELDOS'&&String(m.codigo).trim()===L);}
let perOpen={};
function limpiarFiltrosPer(){['per-desde','per-hasta'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});renderPersonal();}
function togglePagos(id){perOpen[id]=!perOpen[id];renderPersonal();}
function renderPersonal(){const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const q=g('per-q').toLowerCase();const d1=g('per-desde'),d2=g('per-hasta');const ro=ROLES[S.role].readonly;
  const rows=S.empleados.filter(e=>!q||e.nombre.toLowerCase().indexOf(q)>=0||String(e.legajo).toLowerCase().indexOf(q)>=0);
  if(IS_MOBILE()){
    setHTML(document.getElementById('per-table'),'<div class="mlist">'+rows.map(e=>{
      const ps=pagosDe(e.legajo).filter(m=>enRango(m.fecha,d1,d2));const tot=ps.reduce((a,m)=>a+m.monto,0);const op=perOpen[e.id];
      let h=mrow(esc(e.nombre),'Legajo '+esc(e.legajo)+(e.cat?' &middot; '+(CAT_LABEL[e.cat]||('Cat '+e.cat)):''),
        e.jornal?'jornal '+money(e.jornal):'',
        '<div class="ma">'+(tot?money(tot):'<span class="muted">-</span>')+'</div><div class="ms">'+(ps.length?ps.length+' pagos':'sin pagos')+'</div>',
        'togglePagos(\''+e.id+'\')');
      if(op){h+='<div class="msub">'+
        (ps.length?ps.slice().sort((a,b)=>(a.fecha<b.fecha?1:-1)).map(m=>
          mrow(esc(m.detalle||m.concepto),'',fdate(m.fecha)+' &middot; '+m.medio,'<div class="ma">'+money(m.monto)+'</div>')).join('')
        :'<div class="muted" style="padding:6px 0;font-size:12px">Sin pagos en el rango elegido.</div>')+
        (ro?'':'<div style="display:flex;gap:8px;margin-top:9px"><button class="btn sm" style="flex:1" onclick="editEmpleado(\''+e.id+'\')">Editar</button><button class="btn sm danger" onclick="delEmpleado(\''+e.id+'\')">Borrar</button></div>')+'</div>';}
      return h;}).join('')+'</div>'+(rows.length?'':'<div class="empty">Sin resultados.</div>'));
    return;}
  const body=rows.map(e=>{const ps=pagosDe(e.legajo).filter(m=>enRango(m.fecha,d1,d2));const tot=ps.reduce((a,m)=>a+m.monto,0);const op=perOpen[e.id];
    let tr='<tr class="clik" onclick="togglePagos(\''+e.id+'\')"><td><span class="codebox">'+esc(e.legajo)+'</span></td><td>'+esc(e.nombre)+'</td>'+
      '<td>'+(e.cat?'<span class="chip">'+(CAT_LABEL[e.cat]||('Cat '+e.cat))+'</span>':'<span class="muted">-</span>')+'</td>'+
      '<td class="r num">'+(e.jornal?money(e.jornal):'<span class="muted">-</span>')+'</td>'+
      '<td class="r num muted">'+(ps.length||'-')+'</td>'+
      '<td class="r num">'+(tot?money(tot):'<span class="muted">-</span>')+'</td>'+
      (ro?'':'<td class="r" style="white-space:nowrap" onclick="event.stopPropagation()"><button class="btn ghost sm" onclick="editEmpleado(\''+e.id+'\')">Editar</button><button class="btn ghost sm danger" onclick="delEmpleado(\''+e.id+'\')">x</button></td>')+'</tr>';
    if(op){tr+='<tr class="detrow"><td colspan="'+(ro?6:7)+'" style="background:var(--surface-2)">'+
      (ps.length?'<table style="width:100%"><thead><tr><th>Fecha</th><th>Concepto</th><th>Medio</th><th class="r">Importe</th></tr></thead><tbody>'+
        ps.slice().sort((a,b)=>(a.fecha<b.fecha?1:-1)).map(m=>'<tr><td class="num muted">'+fdate(m.fecha)+'</td><td>'+esc(m.detalle||m.concepto)+'</td><td><span class="chip medio">'+m.medio+'</span></td><td class="r num">'+money(m.monto)+'</td></tr>').join('')+'</tbody></table>'
      :'<div class="muted" style="padding:6px 4px">Sin pagos en el rango elegido.</div>')+'</td></tr>';}
    return tr;}).join('');
  setHTML(document.getElementById('per-table'),'<div class="tbl-wrap"><table><thead><tr><th>Legajo</th><th>Nombre</th><th>Categoria</th><th class="r">Jornal</th><th class="r">Pagos</th><th class="r">Total pagado</th>'+(ro?'':'<th></th>')+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
    (rows.length?'':'<div class="empty">Sin resultados.</div>'));}
function editEmpleado(id){const e=id?S.empleados.find(x=>x.id===id):null;const isNew=!e;
  openPanel('<div class="panel-head"><h2>'+(isNew?'Nuevo empleado':'Editar empleado')+'</h2><div class="spacer"></div><button class="btn ghost sm" onclick="closePanel()">x</button></div>'+
  '<div class="panel-body"><div class="form-msg" id="em-msg"></div>'+
    '<div class="row2"><div class="field"><label>Legajo <span class="req">*</span></label><input id="em-leg" value="'+esc(e?e.legajo:'')+'" placeholder="Ej. 101"></div>'+
      '<div class="field"><label>Nombre <span class="req">*</span></label><input id="em-nom" value="'+esc(e?e.nombre:'')+'" placeholder="Apellido y nombre"></div></div>'+
    '<div class="row2"><div class="field"><label>Categoria <span class="req">*</span></label><select id="em-cat"><option value="">Elegi una categoria...</option>'+[1,2,3].map(c=>'<option value="'+c+'" '+(e&&String(e.cat)===String(c)?'selected':'')+'>'+CAT_LABEL[c]+'</option>').join('')+'</select></div>'+
      '<div class="field"><label>Jornal <span class="req">*</span></label><input id="em-jor" inputmode="decimal" value="'+(e&&e.jornal?e.jornal:'')+'" placeholder="Valor del dia o la hora"><div class="hint">El valor de la hora/dia segun categoria.</div></div></div>'+
    '<div class="field"><label>Cuenta / CBU (para transferencias)</label><input id="em-cta" value="'+esc(e&&e.cuenta?e.cuenta:'')+'" placeholder="Nro de cuenta o CBU del banco"><div class="hint">Es la cuenta a la que le transferis. Se usa para armar el Excel del banco. Se completa sola al subir la quincena.</div></div>'+
    '<div style="display:flex;gap:10px;margin-top:6px"><button class="btn primary" style="flex:1" onclick="saveEmpleado(\''+(e?e.id:'')+'\')">Guardar</button><button class="btn ghost" onclick="closePanel()">Cancelar</button></div></div>',true);}
function saveEmpleado(id){const leg=document.getElementById('em-leg').value.trim();const nom=document.getElementById('em-nom').value.trim();
  const cat=document.getElementById('em-cat').value;const jor=num(document.getElementById('em-jor').value);
  const errs=[];if(!leg)errs.push('el legajo');if(!nom)errs.push('el nombre');if(!cat)errs.push('la categoria');if(!jor)errs.push('el jornal');
  if(errs.length){const m=document.getElementById('em-msg');m.className='form-msg show';m.textContent='Falta cargar '+errs.join(', ');return;}
  const cta=(document.getElementById('em-cta')||{}).value||'';
  if(id){const e=S.empleados.find(x=>x.id===id);Object.assign(e,{legajo:leg,nombre:nom,cat:Number(cat),jornal:jor,cuenta:cta.trim()});}
  else S.empleados.unshift({id:uid(),legajo:leg,nombre:nom,cat:Number(cat),jornal:jor,cuenta:cta.trim()});
  save();closePanel();render();toast('Empleado guardado');}
function delEmpleado(id){const e=S.empleados.find(x=>x.id===id);if(e&&confirm('Borrar a "'+e.nombre+'" del padron?')){S.empleados=S.empleados.filter(x=>x.id!==id);save();renderPersonal();toast('Empleado borrado');}}

function armarCSV(list){const src=list||S.movimientos;
  const H=['Fecha','Concepto','Detalle','Codigo','Vinculado a','Rubro','Medio','Ingreso','Egreso','Retencion','Estado'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const body=src.map(m=>[m.fecha||'',m.concepto||'',m.detalle||'',m.codigo||'',nombrePorCodigo(m.codigo)||'',
    m.rubro||'SIN RUBRO',m.medio,m.signo==='ingreso'?m.monto:'',m.signo==='egreso'?m.monto:'',m.ret||'',
    m.anulado?'ANULADO':(m.anulaDe?'CONTRA-MOV':'')].map(q).join(';'));
  return '\ufeff'+[H.map(q).join(';')].concat(body).join('\r\n');}
function bajarLocal(csv,nombre){try{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download=nombre;document.body.appendChild(a);a.click();a.remove();
  toast('Archivo descargado');}catch(e){toast('No se pudo descargar');}}
async function exportCSV(){
  const csv=armarCSV(); const nombre='movimientos-gtsa.csv';
  let d=null;
  try{ if(typeof claude!=='undefined'&&claude&&claude.use) d=await claude.use('downloads'); }catch(e){}
  if(!d){ bajarLocal(csv,nombre); return; }
  try{ await d.save({filename:nombre,data:csv}); toast('Archivo descargado'); }
  catch(err){ const c=err&&err.code;
    if(c==='declined'){ toast('Descarga cancelada'); return; }
    if(c==='extension_not_enabled'||c==='rejected_extension'){
      try{ await d.save({filename:'movimientos-gtsa.txt',data:csv}); toast('Archivo descargado'); return; }catch(e2){}
    }
    bajarLocal(csv,nombre); }}
let toastT;function toast(msg){const t=document.getElementById('toast');
  setHTML(t,'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>'+esc(msg));
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

if(!ROLES[S.role]){S.role='Direccion';}
setHTML(document.getElementById('role-select'),Object.keys(ROLES).map(r=>'<option>'+r+'</option>').join(''));
document.getElementById('role-select').value=S.role;
document.getElementById('btn-nuevo').style.display=ROLES[S.role].all?'':'none';
render();
try{window.matchMedia('(max-width:640px)').addEventListener('change',()=>render());}catch(e){}
</script>
