<meta charset="utf-8">
<script>document.documentElement.setAttribute("data-theme","dark");</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Argos | Demo constructora (datos ficticios)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,450..650;1,450..650&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eef1f4; --surface:#ffffff; --surface-2:#f1f4f7; --surface-3:#e5eaf0;
    --ink:#132030; --ink-soft:#526174; --ink-faint:#8794a4;
    --line:#e2e8ee; --line-strong:#cdd6df;
    --navy:#0d3b60; --navy-deep:#0a2c48; --navy-ink:#0b3252;
    --accent:#0d3b60; --accent-ink:#0a2c48; --accent-soft:#e5edf4;
    --red:#cf2c48; --red-soft:#fbe6ea;
    --pos:#1f7a4d; --pos-soft:#e3f1ea; --neg:#c62a44; --neg-soft:#fbe6ea; --warn:#a9741a; --warn-soft:#f6ecd6;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(13,32,48,.04),0 14px 40px -18px rgba(13,32,48,.18);
    --shadow-sm:0 1px 2px rgba(13,32,48,.05);
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0e141c; --surface:#161e28; --surface-2:#1d2733; --surface-3:#26313f;
      --ink:#e8edf3; --ink-soft:#9fadbd; --ink-faint:#6b7889; --line:#26313f; --line-strong:#374556;
      --navy:#3f7bb0; --navy-deep:#0a2c48; --navy-ink:#5c93c6;
      --accent:#357bb5; --accent-ink:#5c9bd1; --accent-soft:#14283b;
      --red:#e35e78; --red-soft:#2f1a20;
      --pos:#54b585; --pos-soft:#16281f; --neg:#e06178; --neg-soft:#2f1a20; --warn:#d6a141; --warn-soft:#2c2415;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -16px rgba(0,0,0,.65); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --paper:#eef1f4; --surface:#ffffff; --surface-2:#f1f4f7; --surface-3:#e5eaf0;
    --ink:#132030; --ink-soft:#526174; --ink-faint:#8794a4; --line:#e2e8ee; --line-strong:#cdd6df;
    --navy:#0d3b60; --accent:#0d3b60; --accent-ink:#0a2c48; --accent-soft:#e5edf4;
    --red:#cf2c48; --red-soft:#fbe6ea;
    --pos:#1f7a4d; --pos-soft:#e3f1ea; --neg:#c62a44; --neg-soft:#fbe6ea; --warn:#a9741a; --warn-soft:#f6ecd6;
    --shadow:0 1px 2px rgba(13,32,48,.05),0 10px 30px -16px rgba(13,32,48,.22); --shadow-sm:0 1px 2px rgba(13,32,48,.06);
  }
  :root[data-theme="dark"]{
    --paper:#0e141c; --surface:#161e28; --surface-2:#1d2733; --surface-3:#26313f;
    --ink:#e8edf3; --ink-soft:#9fadbd; --ink-faint:#6b7889; --line:#26313f; --line-strong:#374556;
    --navy:#3f7bb0; --accent:#357bb5; --accent-ink:#5c9bd1; --accent-soft:#14283b;
    --red:#e35e78; --red-soft:#2f1a20;
    --pos:#54b585; --pos-soft:#16281f; --neg:#e06178; --neg-soft:#2f1a20; --warn:#d6a141; --warn-soft:#2c2415;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -16px rgba(0,0,0,.65); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  button{font-family:inherit;cursor:pointer}
  h1,h2,h3{margin:0;font-weight:660;letter-spacing:-.015em;text-wrap:balance}
  a{color:var(--accent-ink)}
  .app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
  .side{background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
  .brand{padding:17px 16px 15px;display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--line)}
  .brand img{height:34px;width:auto;flex:none}
  .brand .bt{line-height:1.15}
  .brand b{display:block;font-size:13.5px;letter-spacing:-.01em;color:var(--ink)}
  .brand span{display:block;font-size:10.5px;color:var(--ink-soft);letter-spacing:.02em;text-transform:uppercase}
  nav{padding:10px 10px 20px;display:flex;flex-direction:column;gap:1px}
  .nav-group{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);
    padding:15px 12px 7px;font-weight:700}
  .nav-item{position:relative;display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:9px;border:0;background:none;
    color:var(--ink-soft);font-size:13.5px;text-align:left;width:100%;transition:.13s;font-weight:500}
  .nav-item svg{width:17px;height:17px;flex:none;opacity:.75}
  .nav-item:hover{background:var(--surface-2);color:var(--ink)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:650}
  .nav-item.active svg{opacity:1}
  .nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  .nav-badge{margin-left:auto;font-size:11px;background:var(--surface-3);color:var(--ink-soft);
    padding:1px 7px;border-radius:20px;font-variant-numeric:tabular-nums;font-weight:600}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 84%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:12px 24px}
  .topbar h1{font-size:17px}
  .topbar .sub{font-size:12px;color:var(--ink-soft);font-weight:450;margin-top:1px}
  .spacer{flex:1}
  .rolepick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
  select,input,textarea{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:8px 11px;outline:none;transition:.12s}
  select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    padding:8px 13px;border-radius:9px;font-size:13px;font-weight:560;display:inline-flex;align-items:center;gap:7px;transition:.13s;box-shadow:var(--shadow-sm)}
  .btn:hover{background:var(--surface-2);border-color:var(--ink-faint)}
  .btn svg{width:15px;height:15px}
  .btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:#fff;border-color:transparent;box-shadow:0 1px 2px rgba(13,59,96,.3),0 4px 12px -4px rgba(13,59,96,.35)}
  .btn.primary:hover{background:var(--accent-ink)}
  .btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);box-shadow:none}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
  .btn.danger{color:var(--neg)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .view{padding:24px;max-width:1200px;width:100%}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;margin-bottom:20px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);transition:.15s}
  .tile:hover{transform:translateY(-1px);border-color:var(--line-strong)}
  .tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);display:flex;align-items:center;gap:7px;font-weight:650}
  .tile .lbl .dot{width:8px;height:8px;border-radius:50%}
  .tile .val{font-size:24px;font-weight:750;margin-top:10px;letter-spacing:-.03em}
  .tile .val.neg{color:var(--neg)} .tile .val.pos{color:var(--pos)}
  .tile .meta{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
  .tile.total{background:linear-gradient(140deg,#155a8f 0%,var(--navy) 42%,var(--navy-deep) 100%);color:#fff;border-color:transparent;position:relative;overflow:hidden}
  .tile.total::after{content:"";position:absolute;top:-42px;right:-42px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.07)}
  .tile.total .lbl{color:rgba(255,255,255,.7)} .tile.total .meta{color:rgba(255,255,255,.62)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card-head{display:flex;align-items:center;gap:12px;padding:14px 17px;border-bottom:1px solid var(--line)}
  .card-head h2{font-size:14.5px}
  .card-head .sub{font-size:12px;color:var(--ink-soft)}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);
    font-weight:650;padding:10px 15px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
  td{padding:10px 15px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
  td.r,th.r{text-align:right}
  .amt.pos{color:var(--pos);font-weight:640} .amt.neg{color:var(--neg);font-weight:640}
  .muted{color:var(--ink-faint)}
  .cajagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;padding:15px 17px}
  .cajacard{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:.13s}
  .cajacard:hover{border-color:var(--accent);background:var(--accent-soft)}
  .cajacard .cn{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:capitalize}
  .cajacard .cv{font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  .cajacard .cv.zero{color:var(--ink-faint);font-weight:600}
  .cajanota{padding:0 17px 15px;font-size:11.5px;color:var(--ink-faint);line-height:1.45}
  .cajacard .cc{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)}
  .banner.warnbar{background:var(--warn-soft);border-color:#e3cf9a;color:#6d4c10}
  .demobar{position:sticky;top:0;z-index:60;background:#1d2733;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:12.5px;line-height:1.35}
  .demobar svg{width:15px;height:15px;flex:none;opacity:.85}
  .demobar b{color:#fff}
  .demobar .dbtag{background:var(--red);color:#fff;font-size:10px;font-weight:800;letter-spacing:.09em;padding:2px 8px;border-radius:5px;text-transform:uppercase;flex:none}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:640;padding:2px 8px;border-radius:20px;
    background:var(--surface-3);color:var(--ink-soft);white-space:nowrap}
  .chip.rubro{background:var(--accent-soft);color:var(--accent-ink)}
  .chip.pos{background:var(--pos-soft);color:var(--pos)} .chip.neg{background:var(--neg-soft);color:var(--neg)}
  .chip.warn{background:var(--warn-soft);color:var(--warn)}
  .chip.medio{background:var(--surface-3);color:var(--ink-soft)}
  .codebox{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:var(--surface-2);
    padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
  .toolbar{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;min-width:0}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none;margin-left:auto}
  .toolbar select,.toolbar input,.toolbar .btn{height:36px;box-sizing:border-box}
  .toolbar .flabel{height:36px}
  .search{position:relative;flex:0 1 230px;min-width:170px;max-width:290px}
  .search.imp{flex:0 1 132px;min-width:112px;max-width:140px}
  .search.imp input{padding-left:30px}
  .listcount{font-size:12px;margin:-6px 0 12px;padding-left:2px}
  .chipcat{gap:6px} .chipcat .camt{opacity:.58;font-weight:500;font-variant-numeric:tabular-nums}
  .chipcat.primary .camt{opacity:.82}
  .search input{width:100%;padding-left:34px}
  .search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;color:var(--ink-faint)}
  .flabel{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
  .flabel input{padding:6px 9px}
  tr.clik{cursor:pointer}
  tr.detrow td{padding:8px 15px}
  tr.detrow table th{background:var(--surface-2)}
  .overlay{position:fixed;inset:0;background:rgba(10,22,34,.52);backdrop-filter:blur(2px);z-index:100;
    display:flex;justify-content:flex-end;opacity:0;pointer-events:none;transition:.2s}
  .overlay.open{opacity:1;pointer-events:auto}
  .panel{background:var(--paper);width:min(470px,100%);height:100%;overflow-y:auto;
    border-left:1px solid var(--line);transform:translateX(24px);transition:.22s;box-shadow:-24px 0 60px -24px rgba(0,0,0,.4)}
  .overlay.open .panel{transform:none}
  .panel.center{margin:auto;height:auto;max-height:88vh;width:min(520px,100%);border-radius:var(--radius);
    border:1px solid var(--line);transform:translateY(16px)}
  .overlay.center-mode{align-items:center;justify-content:center}
  .overlay.center-mode .panel{transform:translateY(16px)} .overlay.center-mode.open .panel{transform:none}
  .panel-head{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;gap:10px;
    padding:16px 19px;border-bottom:1px solid var(--line);z-index:2}
  .panel-head h2{font-size:15px}
  .panel-body{padding:19px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:640;color:var(--ink-soft);margin-bottom:5px}
  .field label .req{color:var(--neg)}
  .field input,.field select,.field textarea{width:100%}
  .field .hint{font-size:11px;color:var(--ink-faint);margin-top:4px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg{display:flex;gap:0;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;width:100%}
  .seg button{flex:1;border:0;background:var(--surface);color:var(--ink-soft);padding:9px;font-size:12.5px;font-weight:640;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{color:#fff}
  .seg button.on.ing{background:var(--pos)} .seg button.on.egr{background:var(--neg)}
  .seg button.on.def{background:var(--accent)}
  .field-err{border-color:var(--neg)!important}
  .form-msg{font-size:12.5px;color:var(--neg);background:var(--neg-soft);padding:8px 11px;border-radius:8px;margin-bottom:12px;display:none}
  .form-msg.show{display:block}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);z-index:200;
    background:var(--navy-deep);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:560;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .toast svg{width:16px;height:16px;color:#5fd39b}
  .empty{padding:44px 20px;text-align:center;color:var(--ink-faint)}
  .empty svg{width:34px;height:34px;opacity:.5;margin-bottom:8px}
  .banner{display:flex;gap:11px;align-items:flex-start;background:var(--accent-soft);border:1px solid transparent;
    color:var(--accent-ink);padding:13px 16px;border-radius:var(--radius);font-size:12.5px;margin-bottom:18px}
  .banner svg{width:17px;height:17px;flex:none;margin-top:1px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-bottom:18px}
  .seccard{display:flex;gap:13px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm)}
  .secico{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
  .secico svg{width:20px;height:20px}
  .sectxt h3{font-size:14px;margin:1px 0 5px;color:var(--ink);font-weight:660}
  .sectxt p{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--ink-soft)}
  .scrim{display:none}
  .topbar .tt{min-width:0}
  .topbar .tt h1,.topbar .tt .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bottombar{display:none}
  .fbtn{display:none}
  .mlist{display:flex;flex-direction:column}
  .mrow{display:flex;gap:12px;align-items:center;padding:13px 15px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;font-family:inherit;font-size:inherit;color:inherit}
  .mrow:last-child{border-bottom:0}
  button.mrow:active{background:var(--surface-2)}
  .mrow .ml{flex:1;min-width:0}
  .mrow .mc{font-weight:620;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .md{font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .mrow .mm{font-size:11px;color:var(--ink-faint);margin-top:3px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .mrow .mr{flex:none;text-align:right;max-width:46%}
  .mrow .ma{font-weight:700;font-size:14.5px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .mrow .ma.pos{color:var(--pos)}
  .mrow .ma.neg{color:var(--ink)}
  .mrow .ms{font-size:10.5px;color:var(--ink-faint);margin-top:2px;display:flex;gap:6px;justify-content:flex-end;align-items:center}
  .msub{background:var(--surface-2);border-bottom:1px solid var(--line);padding:6px 15px 12px}
  @media(max-width:880px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;z-index:70;width:min(300px,86vw);transform:translateX(-100%);transition:.2s;visibility:hidden}
    .side.open{transform:none;visibility:visible;box-shadow:24px 0 60px -24px rgba(0,0,0,.45)}
    .scrim.show{display:block;position:fixed;inset:0;background:rgba(10,22,34,.45);z-index:65}
    .grid2{grid-template-columns:1fr}
    select,input,textarea{font-size:16px}
    .toolbar select,.toolbar input,.toolbar .btn{height:40px}
    .toolbar .flabel{height:auto}
    .search svg{top:12px}
    .topbar{backdrop-filter:none;background:var(--paper)}
    .bottombar{display:flex;flex-direction:row;gap:0;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px -12px rgba(13,32,48,.25)}
    .bb-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--ink-faint);font-size:10px;font-weight:620;padding:5px 2px 3px;border-radius:10px;letter-spacing:.01em}
    .bb-item svg{width:22px;height:22px}
    .bb-item.active{color:var(--accent-ink)}
    .view{padding-bottom:96px}
    #btn-nuevo{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:49;width:54px;height:54px;border-radius:50%;justify-content:center;padding:0;box-shadow:0 8px 22px -6px rgba(10,44,72,.55)}
    #btn-nuevo .bn-txt{display:none}
    #btn-nuevo svg{width:22px;height:22px}
  }
  @media(max-width:640px){
    .demobar{position:static;font-size:11.5px;padding:7px 12px}
    .topbar{padding:11px 14px;gap:10px}
    .topbar h1{font-size:17px}
    .topbar .tt .sub{font-size:11.5px}
    .rolepick span{display:none}
    .view{padding:14px 12px 96px}

const money=(n,cur)=>{cur=cur||'ARS';
  // Con centavos muestra 2 decimales (los cheques y transferencias pueden venir con centavos - Direccion 01/09)
  const a=Math.abs(n);const dec=Math.round(a*100)%100!==0;
  const v=new Intl.NumberFormat('es-AR',{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0}).format(dec?a:Math.round(a));
  const s=(cur==='USD'?'US$':'$')+' '+v;return n<0?'-'+s:s;};

// Un movimiento "vivo" es el que cuenta para estados y analisis: ni anulado ni contra-movimiento.
function movActivo(m){return !m.anulado&&!m.anulaDe;}
// Los estados NO se editan a mano: se derivan de los movimientos vivos vinculados.
// Factura con cobro/pago vinculado -> Cobrada/Pagada. Se anula el movimiento -> vuelve a Pendiente.
// Cuanto se le imputo a una factura: movimientos vinculados directos (historial) + cobranzas/pagos vivos.
// Las cobranzas incluyen retenciones en el imputado: la retencion tambien cancela factura.
function imputadoDe(id){
  const legacy=S.movimientos.filter(m=>movActivo(m)&&m.factura===id).reduce((a,m)=>a+m.monto,0);
  const cob=(S.cobranzas||[]).filter(c=>!c.anulado&&c.factura===id).reduce((a,c)=>a+(c.imputado||0),0);
  const pag=(S.pagos||[]).filter(p=>!p.anulado&&p.factura===id).reduce((a,p)=>a+(p.imputado||0),0);
  return legacy+cob+pag;
}
function cobradoZ(certId){return (S.cajam||[]).filter(e=>!e.anulado&&e.certId===certId).reduce((a,e)=>a+e.monto,0);}
function syncEstados(){
  const links={};S.movimientos.forEach(m=>{if(!movActivo(m))return;if(m.cert)links[m.cert]=m;});
  (S.ventas||[]).forEach(v=>{v.cobradoMonto=imputadoDe(v.id);
    v.cobrado=!!v.saldadaInicial||v.cobradoMonto>=(v.importe||0)-1;
    v.parcial=!v.cobrado&&v.cobradoMonto>0;});
  (S.compras||[]).forEach(c=>{c.pagadoMonto=imputadoDe(c.id);
    c.pagado=!!c.saldadaInicial||c.pagadoMonto>=(c.importe||0)-1;
    c.parcial=!c.pagado&&c.pagadoMonto>0;});
  (S.obras||[]).forEach(o=>(o.certificados||[]).forEach(c=>{
    if(c.tipo==='Z'){c.cobradoMonto=cobradoZ(c.id);c.cobrado=!!c.saldadaInicial||c.cobradoMonto>=c.monto-1;return;}
    const m=links[c.id];c.cobrado=!!c.saldadaInicial||!!m;if(m)c.cobradoMonto=m.monto;}));
  (S.cheques||[]).forEach(ch=>{if(ch.movId){const m=S.movimientos.find(x=>x.id===ch.movId);
    if(!m||!movActivo(m)){ch.estado='En cartera';ch.destino='';ch.egreso='';ch.movId=null;}}});
  // Cheque propio: si su movimiento de debito se anulo, el cheque queda anulado tambien.
  (S.chequesPropios||[]).forEach(ch=>{if(ch.movId&&!ch.anulado){const m=S.movimientos.find(x=>x.id===ch.movId);
    if(!m||!movActivo(m))ch.anulado=true;}});
}
// Migracion: lo que ya estaba marcado cobrado/pagado sin movimiento vinculado queda como
// "saldada al inicio" (saldo de arranque), asi no vuelve a Pendiente con el cambio de logica.
function migrar(s){
  // "Banco" generico se abrio en dos cuentas reales. Lo historico va a Galicia (provisorio, confirmar con Direccion).
  (s.movimientos||[]).forEach(m=>{if(m.medio==='Banco')m.medio='Banco Galicia';});
  if(s.role==='Carlitos')s.role='Capataz';
  s.openings=s.openings||{};
  if(s.openings.Banco!=null){s.openings['Banco Galicia']=(s.openings['Banco Galicia']||0)+s.openings.Banco;delete s.openings.Banco;}
  if(s.openings['Cuenta Inviu']==null)s.openings['Cuenta Inviu']=0;
  if(Array.isArray(s.rubros)&&s.rubros.indexOf('GASTOS BANCARIOS')<0)s.rubros.push('GASTOS BANCARIOS');
  (s.movimientos||[]).forEach(m=>{if(m.rubro==='GASTOS BANCARIOS'&&!m.subcat)m.subcat=(m.concepto||'').split(' - ')[0];});
  const act=(s.movimientos||[]).filter(m=>!m.anulado&&!m.anulaDe);
  const linked=id=>act.some(m=>m.factura===id||m.cert===id);
  (s.ventas||[]).forEach(v=>{if(v.cobrado&&!linked(v.id))v.saldadaInicial=true;});
  (s.compras||[]).forEach(c=>{if(c.pagado&&!linked(c.id))c.saldadaInicial=true;});
  (s.obras||[]).forEach(o=>(o.certificados||[]).forEach(c=>{if(c.cobrado&&!linked(c.id))c.saldadaInicial=true;}));
  // Cuadro de cheques propios: se reconstruye desde los pagos historicos que usaron esa forma.
  if(!Array.isArray(s.chequesPropios))s.chequesPropios=[];
  (s.pagos||[]).forEach(p=>(p.formas||[]).forEach(f=>{
    if(f.metodo==='Cheque propio'&&f.numero&&!s.chequesPropios.some(c=>c.pagoId===p.id&&c.numero===f.numero))
      s.chequesPropios.push({id:uid(),fecha:f.fechaCh||p.fecha,numero:f.numero,importe:f.monto||0,destino:p.proveedor||'',pagoId:p.id,anulado:!!p.anulado});}));
  return s;
}

function byRubroBars(d1,d2){

    '<div style="height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden"><div style="width:'+(d.t/max*100)+'%;height:100%;background:linear-gradient(90deg,var(--navy),#2f6ea3);border-radius:6px"></div></div></div>').join('')

function chartMensual(){
  const M={};S.movimientos.forEach(m=>{if(!m.fecha||!movActivo(m))return;const k=m.fecha.slice(0,7);if(!M[k])M[k]={ing:0,egr:0};if(m.signo==='ingreso')M[k].ing+=m.monto;else M[k].egr+=m.monto;});
  const keys=Object.keys(M).sort();if(!keys.length)return '<div class="empty">Sin datos para graficar.</div>';
  const max=Math.max.apply(null,keys.map(k=>Math.max(M[k].ing,M[k].egr)).concat([1]));
  const W=Math.max(320,keys.length*76),H=180,pad=24,bw=20,gap=6;
  let bars='',labels='';
  keys.forEach((k,i)=>{const x=pad+i*((W-pad*2)/keys.length)+((W-pad*2)/keys.length-bw*2-gap)/2;
    const hi=(M[k].ing/max)*(H-pad*2),he=(M[k].egr/max)*(H-pad*2);
    bars+='<rect x="'+x.toFixed(1)+'" y="'+(H-pad-hi).toFixed(1)+'" width="'+bw+'" height="'+hi.toFixed(1)+'" rx="3" fill="var(--pos)"><title>'+k+' ingresos '+money(M[k].ing)+'</title></rect>'+
      '<rect x="'+(x+bw+gap).toFixed(1)+'" y="'+(H-pad-he).toFixed(1)+'" width="'+bw+'" height="'+he.toFixed(1)+'" rx="3" fill="var(--neg)"><title>'+k+' egresos '+money(M[k].egr)+'</title></rect>';
    const mm=k.slice(5)+'/'+k.slice(2,4);
    labels+='<text x="'+(x+bw+gap/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--ink-faint)">'+mm+'</text>';});
  return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:'+W+'px;max-width:100%;height:auto"><line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="var(--line)"/>'+bars+labels+'</svg></div>'+
    '<div style="display:flex;gap:16px;font-size:12px;margin-top:8px"><span><span style="display:inline-block;width:10px;height:10px;background:var(--pos);border-radius:2px;margin-right:5px"></span>Ingresos</span>'+
    '<span><span style="display:inline-block;width:10px;height:10px;background:var(--neg);border-radius:2px;margin-right:5px"></span>Egresos</span></div>';
}

// Contabilidad real: los movimientos no se borran, se anulan con un contra-movimiento.

function anularMovSilent(m){if(!m||m.anulado||m.anulaDe)return;
  const contra={id:uid(),orden:Date.now(),fecha:m.fecha,concepto:'ANULACION: '+m.concepto,
    detalle:'Contra-movimiento del asiento del '+fdate(m.fecha)+(m.detalle?' - '+m.detalle:''),
    codigo:m.codigo,rubro:m.rubro,medio:m.medio,monto:m.monto,
    signo:(m.signo==='ingreso'?'egreso':'ingreso'),concil:false,ret:null,anulaDe:m.id};
  m.anulado=true;m.anuladoPor=contra.id;
  S.movimientos.push(contra);}
function anularMov(id,desdePanel){const m=S.movimientos.find(x=>x.id===id);if(!m)return;
  if(m.anulado){toast('Ese movimiento ya esta anulado');return;}
  if(m.anulaDe){toast('Un contra-movimiento no se anula: anularias la correccion');return;}
  if(m.cobranzaId){toast('Este asiento salio de una cobranza o pago: anulalo desde Facturacion y se revierte todo junto');return;}
  if(!confirm('Anular este movimiento con un contra-movimiento?\n\nNo se borra nada: se asienta el movimiento inverso, los dos quedan en el libro y los saldos vuelven atras. Si estaba vinculado a una factura, certificado o cheque, vuelve a su estado pendiente.'))return;
  anularMovSilent(m);
  save();if(desdePanel)closePanel();render();toast('Anulado con contra-movimiento, saldos y estados actualizados');}

// Buscador con sugerencias propio: el datalist nativo del navegador se trababa (Edge no
// filtraba al tipear, quedaba clavado en la A - reporte Direccion 01/09). Filtra sin acentos,
// por cualquier parte del nombre o del codigo; toca una sugerencia para elegirla.
function normTxt(s){return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function sugiere(inpId,getList,onPick){const inp=document.getElementById(inpId);if(!inp)return;
  inp.removeAttribute('list');inp.setAttribute('autocomplete','off');
  const wrap=inp.parentNode;wrap.style.position='relative';
  let box=null;
  const close=()=>{if(box){box.remove();box=null;}};
  const render=()=>{close();const q=normTxt(inp.value.trim());
    const items=getList().filter(x=>!q||normTxt(x).includes(q)).slice(0,8);
    if(!items.length)return;
    box=document.createElement('div');box.className='sugbox';
    items.forEach(x=>{const d=document.createElement('div');d.className='sugit';d.textContent=x;
      d.addEventListener('mousedown',e=>{e.preventDefault();inp.value=x;close();if(onPick)onPick();});
      box.appendChild(d);});
    wrap.appendChild(box);};
  inp.addEventListener('input',render);
  inp.addEventListener('focus',render);
  inp.addEventListener('blur',()=>setTimeout(close,180));}

// Convencion fijada por Nacho 01/09: el punto es SIEMPRE separador de miles y despues de cada
// punto van EXACTAMENTE 3 cifras (1.000.000); la coma es SIEMPRE centavos (2.789.097,78).
// Un formato invalido (ej. 2.789.097.78 o 2000.60) vale 0 y NO se deja cargar: el campo se
// marca en rojo y los guardados lo rechazan como "falta el importe".
const NUM_RE=/^-?\d+(\.\d{3})*(,\d{1,2})?$/;
function numOk(v){if(typeof v==='number')return true;v=(v||'').toString().trim();return !v||NUM_RE.test(v);}
function num(v){if(typeof v==='number')return isFinite(v)?v:0;
  v=(v||'').toString().trim();if(!v||!NUM_RE.test(v))return 0;
  return parseFloat(v.replace(/\./g,'').replace(',','.'))||0;}
// Al salir de un campo de importe queda formateado con separador de miles (pedido Direccion
// 01/09: "cuando cargas numeros no pone comas"). num() lo vuelve a leer bien igual.
function fmtImp(n){if(!isFinite(n)||!n)return '';
  const dec=Math.round(Math.abs(n)*100)%100!==0;
  return new Intl.NumberFormat('es-AR',{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0}).format(n);}
document.addEventListener('focusout',function(e){const el=e.target;
  if(!el||el.tagName!=='INPUT'||el.getAttribute('inputmode')!=='decimal'||el.readOnly)return;
  const v=(el.value||'').trim();el.classList.remove('numbad');if(!v)return;
  if(!numOk(v)){el.classList.add('numbad');
    toast('Revisa el importe: despues de un punto van 3 cifras (el punto es de miles) y los centavos van con coma. Ej: 2.789.097,78');return;}
  const n=num(v);if(n)el.value=fmtImp(n);});
function saveMovimiento(){const msg=document.getElementById('mf-msg');const errs=[];
  const fecha=document.getElementById('mf-fecha').value;const concepto=document.getElementById('mf-concepto').value.trim();
  const monto=num(document.getElementById('mf-monto').value);let ret=num(document.getElementById('mf-ret').value);const obs=document.getElementById('mf-obs').value.trim();
  [['mf-fecha',fecha],['mf-concepto',concepto],['mf-monto',monto]].forEach(p=>{document.getElementById(p[0]).classList.toggle('field-err',!p[1]);});
  if(!fecha)errs.push('Falta la fecha');if(!concepto)errs.push('Falta el concepto');if(!monto)errs.push('El monto tiene que ser mayor a 0');
  // Forma de pago: transferencia (medio = la cuenta elegida) o cheque de cartera (endoso, sin retencion).
  if(movForm.tipo!=='transfer'){
    const forma=(movForm.signo==='ingreso')?'Transferencia':(((document.getElementById('mf-forma')||{}).value)||'Transferencia');
    if(movForm.cheque){movForm.medio=(movForm.cheque.estado==='Endosado')?'Cheque':(((document.getElementById('mf-cuenta')||{}).value)||CUENTAS[0]);if(movForm.cheque.estado==='Endosado')ret=0;}
    else if(forma==='Cheque'){movForm.medio='Cheque';ret=0;
      if(!movForm.editId){const chId=((document.getElementById('mf-cheq')||{}).value)||'';
        if(!chId)errs.push('Elegi que cheque de cartera sale');
        else movForm.cheque={id:chId,estado:'Endosado'};}}
    else if(forma==='Tarjeta Visa'){movForm.medio='Tarjeta Visa';ret=0;}
    else{movForm.medio=(((document.getElementById('mf-cuenta')||{}).value)||movForm.medio);}
  }
  if(movForm.tipo==='transfer'){const o=document.getElementById('mf-origen').value,d=document.getElementById('mf-destino').value;
    if(o===d)errs.push('La transferencia tiene que ir entre cuentas distintas');
    if(!errs.length){const base=Date.now();
      S.movimientos.push({id:uid(),orden:base,fecha:fecha,concepto:concepto+' (transf.)',detalle:'Sale de '+o,codigo:'',rubro:'VARIOS',medio:o,monto:monto,signo:'egreso',concil:false,ret:null});
      S.movimientos.push({id:uid(),orden:base+1,fecha:fecha,concepto:concepto+' (transf.)',detalle:'Entra a '+d,codigo:'',rubro:'VARIOS',medio:d,monto:monto,signo:'ingreso',concil:false,ret:null});}
  }else{const codigo=codigoDesdeInput(document.getElementById('mf-codigo').value);const rubro=document.getElementById('mf-rubro').value;const obra=document.getElementById('mf-obra').value.trim();
    const subcat=((document.getElementById('mf-subcat')||{}).value||'').trim();
    const facSel=(document.getElementById('mf-factura')||{}).value||'';const facId=facSel?facSel.slice(2):'';
    document.getElementById('mf-rubro').classList.toggle('field-err',!rubro);
    if(!rubro)errs.push('Falta el rubro');
    if(!errs.length){const det=[obs,obra?('Obra '+obra):''].filter(Boolean).join(' - ');
      if(movForm.editId){const o=S.movimientos.find(m=>m.id===movForm.editId);
        Object.assign(o,{fecha:fecha,concepto:concepto,detalle:det,codigo:codigo,rubro:rubro,medio:movForm.medio,monto:monto,signo:movForm.signo,ret:ret||null,factura:facId||null,subcat:subcat||null});}

function cargarArchivoExt(inp){const f=inp.files&&inp.files[0];if(!f)return;

function partirLinea(l){let p;
  if(l.indexOf('\t')>=0)p=l.split('\t');
  else if(l.indexOf(';')>=0)p=l.split(';');
  else if(/\s{2,}/.test(l))p=l.split(/\s{2,}/);
  else if(l.indexOf(',')>=0&&!/^-?[\d.,]+$/.test(l.replace(/\s/g,'')))p=l.split(',');
  else p=[l];
  return p.map(x=>x.trim()).filter(Boolean);}
function procesarExtracto(){const txt=document.getElementById('ext-in').value.trim();const out=document.getElementById('ext-out');
  if(!txt){setHTML(out,'<div class="empty">Trae el extracto primero.</div>');return;}
  let lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let ok=0,nomatch=0;
  const toISO=d=>{const m=(d||'').match(/(\d{1,2})\D(\d{1,2})\D(\d{2,4})/);if(!m)return '';
    const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);};
  const esFecha=p=>/\d{1,2}\D\d{1,2}\D\d{2,4}/.test(p);
  const esNum=p=>/^-?[\d]{1,3}([.,]?\d{3})*([.,]\d{1,2})?$/.test(p.replace(/\s/g,''))||/^-?\d+([.,]\d+)?$/.test(p.replace(/\s/g,''));
  const dif=(a,b)=>{if(!a||!b)return 99;return Math.abs((new Date(a)-new Date(b))/86400000);};
  if(lines.length&&(function(){const c=partirLinea(lines[0]);return !c.some(esFecha)&&!c.some(esNum);})())lines=lines.slice(1);
  const rows=lines.map(l=>{const parts=partirLinea(l);
    let fec='',imp=0;const txtParts=[];
    parts.forEach(p=>{if(!fec&&esFecha(p)){fec=toISO(p);return;}if(esNum(p)){imp=Math.abs(num(p));return;}txtParts.push(p);});
    if(!imp){for(let i=parts.length-1;i>=0;i--){if(esNum(parts[i])){imp=Math.abs(num(parts[i]));break;}}}
    const concepto=txtParts.join(' ')||parts[0];
    const cand=S.movimientos.filter(m=>movActivo(m)&&CUENTAS.indexOf(m.medio)>=0&&!m._used&&Math.abs(m.monto-imp)<Math.max(imp*0.005,1));
    cand.sort((a,b)=>dif(a.fecha,fec)-dif(b.fecha,fec));
    const hit=cand.length&&dif(cand[0].fecha,fec)<=3?cand[0]:null;
    if(hit){hit._used=true;hit.concil=true;ok++;}else nomatch++;
    return {fecha:fec,concepto:concepto,imp:imp,hit:hit};});
  S.movimientos.forEach(m=>{delete m._used;});save();
  setHTML(out,'<div class="tiles" style="margin-bottom:14px"><div class="tile"><div class="lbl"><span class="dot" style="background:var(--pos)"></span>Conciliados</div><div class="val num pos">'+ok+'</div></div>'+
    '<div class="tile"><div class="lbl"><span class="dot" style="background:var(--warn)"></span>Sin match</div><div class="val num">'+nomatch+'</div></div></div>'+
    (IS_MOBILE()?'<div class="mlist">'+rows.map(r=>
      mrow(esc(r.concepto),'',r.fecha?fdate(r.fecha):'',
        '<div class="ma">'+money(r.imp)+'</div><div class="ms">'+(r.hit?'<span class="chip pos">Conciliado</span>':'<span class="chip warn">Revisar</span>')+'</div>')).join('')+'</div>'
    :'<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Concepto (banco)</th><th class="r">Importe</th><th>Estado</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td class="num muted">'+(r.fecha?fdate(r.fecha):'-')+'</td><td>'+esc(r.concepto)+'</td><td class="r num">'+money(r.imp)+'</td>'+
      '<td>'+(r.hit?'<span class="chip pos">Conciliado</span>':'<span class="chip warn">Revisar</span>')+'</td></tr>').join('')+'</tbody></table></div>'));
  toast(ok+' movimientos conciliados');}

    concepto:'Endoso cheque '+ch.numero+' '+ch.banco,monto:ch.importe,rubro:'COMPRAS',cheque:{id:ch.id,estado:'Endosado'},
    nota:'<b>Endoso del cheque '+esc(ch.numero)+'</b> ('+esc(ch.banco)+', '+money(ch.importe)+'). En "Vinculado a" elegi a quien se lo entregas: queda como destino del cheque. Si el endoso paga una factura de compra, vinculala tambien. Al guardar pasa a Endosado; se corrige anulando el movimiento.'});}
function saveCheque(){const f=document.getElementById('ch-fecha').value,i=num(document.getElementById('ch-imp').value),o=document.getElementById('ch-origen').value.trim();
  const banco=document.getElementById('ch-banco').value.trim(),numero=document.getElementById('ch-num').value.trim(),vto=document.getElementById('ch-vto').value,estado=document.getElementById('ch-estado').value;
  const destino=document.getElementById('ch-destino').value.trim(),egreso=document.getElementById('ch-egreso').value;
  const errs=[];if(!f)errs.push('la fecha');if(!i)errs.push('el importe');if(!o)errs.push('el origen');if(!banco)errs.push('el banco');if(!numero)errs.push('el numero');if(!vto)errs.push('el vencimiento');
  if(estado!=='En cartera'){if(!destino)errs.push('el destino');if(!egreso)errs.push('la fecha de salida');}
  if(errs.length){const m=document.getElementById('ch-msg');m.className='form-msg show';m.textContent='Falta cargar '+errs.join(', ');return;}
  // Cheque duplicado (mismo numero y banco, no anulado) = error contable
  if(S.cheques.some(c=>c.estado!=='Anulado'&&(c.numero||'').trim()===numero&&((c.banco||'')+'').trim().toUpperCase()===banco.toUpperCase())){
    const m=document.getElementById('ch-msg');m.className='form-msg show';m.textContent='Ya hay un cheque N '+numero+' de '+banco+' cargado en el sistema';return;}
  S.cheques.unshift({id:uid(),recibido:f,origen:o,banco:banco,numero:numero,importe:i,vto:vto,destino:destino,egreso:egreso,estado:estado});
  save();closePanel();render();toast('Cheque cargado');}
// Cheques propios (emitidos por GTSA, Galicia): entran solos al pagar con "Cheque propio",
// o a mano para historial. Estado derivado: a debitar / debitado segun la fecha del cheque.
function chpEstado(c){if(c.anulado)return['Anulado','neg'];
  return c.fecha<=hoyISO()?['Debitado','pos']:['A debitar','warn'];}
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function openChequePropio(){openPanel('<div class="panel-head"><h2>Cargar cheque propio</h2><div class="spacer"></div><button class="btn ghost sm" onclick="closePanel()">x</button></div>'+
  '<div class="panel-body"><div class="form-msg" id="chp-msg"></div>'+
    '<div class="banner" style="margin-bottom:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4m0 4h.01M22 12a10 10 0 11-20 0 10 10 0 0120 0z"/></svg>'+
    '<div>Esto es para <b>historial</b>: cheques que emitiste antes de arrancar con el sistema. Los pagos nuevos con cheque propio se registran desde <b>Facturacion &gt; Pagos</b> y entran solos a este cuadro con su asiento.</div></div>'+
    '<div class="row2"><div class="field"><label>Fecha del cheque <span class="req">*</span></label><input type="date" id="chp-fecha"></div>'+
      '<div class="field"><label>Numero <span class="req">*</span></label><input id="chp-num" placeholder="00000000"></div></div>'+
    '<div class="row2"><div class="field"><label>Importe <span class="req">*</span></label><input id="chp-imp" inputmode="decimal" placeholder="0"></div>'+

    '<button class="btn primary" style="width:100%" onclick="saveChequePropio()">Guardar cheque propio</button></div>');}
function saveChequePropio(){const f=document.getElementById('chp-fecha').value,n=document.getElementById('chp-num').value.trim();
  const i=num(document.getElementById('chp-imp').value),d=document.getElementById('chp-dest').value.trim();
  const errs=[];if(!f)errs.push('la fecha');if(!n)errs.push('el numero');if(!i)errs.push('el importe');if(!d)errs.push('el destino');
  if(errs.length){const m=document.getElementById('chp-msg');m.className='form-msg show';m.textContent='Falta cargar '+errs.join(', ');return;}
  S.chequesPropios.unshift({id:uid(),fecha:f,numero:n,importe:i,destino:d,manual:true});
  save();closePanel();render();toast('Cheque propio cargado');}
function delChequePropio(id){const c=S.chequesPropios.find(x=>x.id===id);if(!c||!c.manual)return;
  if(confirm('Borrar el cheque propio N '+c.numero+' del registro? (era carga manual, no toca el libro)')){S.chequesPropios=S.chequesPropios.filter(x=>x.id!==id);save();render();toast('Cheque propio borrado');}}
function estadoFactChip(f,esVenta){const done=esVenta?f.cobrado:f.pagado;const m=(esVenta?f.cobradoMonto:f.pagadoMonto)||0;
  if(done)return '<span class="chip pos">'+(esVenta?'Cobrada':'Pagada')+'</span>';
  if(m>0)return '<span class="chip warn" title="Imputado '+money(m)+'">Parcial - debe '+money(f.importe-m)+'</span>';
  return '<span class="chip warn">Pendiente</span>';}
let factTab='ventas';let factSec='facturas';
function facturasTab(t){factTab=t;factSec='facturas';render();}
function facturasSec(s){factSec=s;render();}
function ivaOf(f){return f.iva||0;} function netoOf(f){return f.neto!=null?f.neto:(f.importe||0)-(f.iva||0);}
function iibbOf(f){return (f.iibbProv||0)+(f.iibbCaba||0);}
function ivaTiles(){const ivaDeb=S.ventas.reduce((a,v)=>a+(v.iva||0),0);const ivaCred=S.compras.reduce((a,c)=>a+(c.iva||0),0);
  return '<div class="tiles"><div class="tile"><div class="lbl">IVA debito (ventas)</div><div class="val num">'+money(ivaDeb)+'</div><div class="meta">'+S.ventas.length+' facturas de venta</div></div>'+
    '<div class="tile"><div class="lbl">IVA credito (compras)</div><div class="val num">'+money(ivaCred)+'</div><div class="meta">'+S.compras.length+' facturas de compra</div></div>'+
    '<div class="tile total"><div class="lbl">IVA a pagar (estimado)</div><div class="val num">'+money(ivaDeb-ivaCred)+'</div><div class="meta">debito menos credito - se recalcula con cada factura</div></div></div>';}
function renderFacturas(){const el=document.getElementById('fact-body');if(!el)return;

  if(factSec==='cobros'){return side==='ventas'?renderCobranzas(el,admin):renderPagos(el,admin);}
  if(factSec==='ctacte'){return renderCtaCteFact(el,side);}
  if(factSec==='maestro'){return side==='ventas'?renderClientes(el,puedeCargar):renderProvsFact(el);}
  if(factSec==='acopios'){return renderAcopios(el,puedeCargar);}
  if(factSec==='iva'){return renderIvaFact(el);}
  if(factTab==='ventas'){const tot=S.ventas.reduce((a,v)=>a+v.importe,0);const cob=S.ventas.reduce((a,v)=>a+Math.min(v.cobrado?v.importe:(v.cobradoMonto||0),v.importe),0);
    setHTML(el,ivaTiles()+'<div class="card"><div class="card-head"><h2>Facturas de venta</h2><div class="sub">Facturado '+money(tot)+' - Cobrado '+money(cob)+' - Por cobrar '+money(tot-cob)+'</div><div class="spacer"></div>'+

          '<div class="ma">'+money(v.importe)+'</div><div class="ms">'+(v.cobrado?'<span class="chip pos">Cobrada</span>':(admin?'<button class="btn sm" onclick="openCobranza(\''+v.id+'\')">Registrar cobro</button>':estadoFactChip(v,true)))+'</div>')).join('')+'</div>'
      :'<div class="tbl-wrap"><table><thead><tr><th>N</th><th>Cliente</th><th>Obra</th><th>Fecha</th><th class="r">Neto</th><th class="r">IVA</th><th class="r">Total</th><th>Estado</th>'+(admin?'<th></th>':'')+'</tr></thead><tbody>'+

        '<td>'+estadoFactChip(v,true)+'</td>'+
        (admin?'<td class="r">'+(v.cobrado?'':'<button class="btn sm" onclick="openCobranza(\''+v.id+'\')">Registrar cobro</button>')+'</td>':'')+'</tr>').join('')+
      '</tbody></table></div>')+'</div>'+(admin
        ?'<div class="hint" style="padding:8px 2px">El estado lo pone el sistema: Pendiente, Parcial (con el saldo a la vista) o Cobrada, segun lo imputado en Cobranzas. Para corregir, anula la cobranza y la factura recupera su saldo.</div>'
        :'<div class="hint" style="padding:8px 2px">Los cobros los registran Direccion o Socio en Cobranzas. El estado cambia solo.</div>'));
  }else{const tot=S.compras.reduce((a,c)=>a+c.importe,0);const pag=S.compras.reduce((a,c)=>a+Math.min(c.pagado?c.importe:(c.pagadoMonto||0),c.importe),0);
    setHTML(el,ivaTiles()+'<div class="card"><div class="card-head"><h2>Facturas de compra</h2><div class="sub">Total '+money(tot)+' - Pagado '+money(pag)+' - Por pagar '+money(tot-pag)+'</div><div class="spacer"></div>'+
      (puedeCargar?'<button class="btn primary sm" onclick="openCompra()">+ Factura de compra</button>':'')+'</div>'+
      (IS_MOBILE()?'<div class="mlist">'+S.compras.map(c=>{const nom=nombrePorCodigo(c.proveedor);
        return mrow(esc(nom||c.proveedor),esc(c.numero)+(c.obra?' &middot; obra '+esc(c.obra):'')+(c.detalle?' &middot; '+esc(c.detalle):''),fdate(c.fecha)+' &middot; IVA '+money(ivaOf(c))+(c.remito?'':' &middot; <span class="chip warn" style="font-size:10px;padding:1px 6px">sin remito</span>'),

      S.compras.map(c=>{const nom=nombrePorCodigo(c.proveedor);return '<tr><td><span class="codebox">'+esc(c.numero)+'</span></td>'+

        '<td>'+estadoFactChip(c,false)+'</td>'+
        (admin?'<td class="r">'+(c.pagado?'':'<button class="btn sm" onclick="openPago(\''+c.id+'\')">Registrar pago</button>')+'</td>':'')+'</tr>';}).join('')+
      '</tbody></table></div>')+'</div>'+(admin
        ?'<div class="hint" style="padding:8px 2px">El estado lo pone el sistema: Pendiente, Parcial (con el saldo a la vista) o Pagada, segun lo imputado en Pagos. Para corregir, anula el pago y la factura recupera su saldo. Regla de la casa: sin remito no se paga.</div>'
        :'<div class="hint" style="padding:8px 2px">Los pagos los registran Direccion o Socio en Pagos. El estado cambia solo.</div>'));
  }}
// Alicuotas de IVA reales (no todo es 21%). La factura se carga como en el papel:
// neto + IVA (+ IIBB en compras) y el total se arma solo.
const ALICUOTAS=['10.5','21','27','5','2.5','0']; // 10,5 primero: es la que mas usan (pedido Direccion 01/09)
function aliOpts(){return ALICUOTAS.map(a=>'<option value="'+a+'"'+(a==='10.5'?' selected':'')+'>'+(a==='0'?'Exento / 0%':a.replace('.',',')+'%')+'</option>').join('');}
function factCalc(p){const neto=num(document.getElementById(p+'-neto').value);
  const ali=parseFloat(document.getElementById(p+'-ali').value)||0;
  const ivaEl=document.getElementById(p+'-iva');ivaEl.value=neto?Math.round(neto*ali/100):'';
  factTotal(p);}
function factTotal(p){const g=id=>{const e=document.getElementById(p+'-'+id);return e?num(e.value):0;};
  const total=g('neto')+g('iva')+g('iibbp')+g('iibbc')+g('retiva')+g('otros');
  const t=document.getElementById(p+'-total');if(!t)return;
  if(t.tagName==='INPUT'){if(!t.dataset.touched)t.value=total?fmtImp(total):'';}
  else t.textContent=money(total);}

let veTipoV='A';
function veTipo(t,btn){veTipoV=t;[].forEach.call(document.querySelectorAll('[data-vtipo]'),b=>b.className=b.getAttribute('data-vtipo')===t?'on def':'');}
function saveVenta(){const n=document.getElementById('ve-num').value.trim(),c=document.getElementById('ve-cli').value.trim();
  const neto=num(document.getElementById('ve-neto').value);const iva=num(document.getElementById('ve-iva').value);
  const fecha=document.getElementById('ve-fecha').value,obra=document.getElementById('ve-obra').value.trim();const det=document.getElementById('ve-det').value.trim();
  const errs=[];if(!n)errs.push('el N de factura');if(!fecha)errs.push('la fecha');if(!c)errs.push('el cliente');if(!obra)errs.push('la obra (o "Otros")');if(!neto)errs.push('el subtotal neto');
  if(c==='Otro'&&!det)errs.push('el detalle (quien es y que se le cobra, porque elegiste "Otro")');
  if(errs.length){const m=document.getElementById('ve-msg');m.className='form-msg show';m.textContent='Falta cargar '+errs.join(', ');return;}
  S.ventas.unshift({id:uid(),numero:n,tipo:veTipoV,cliente:c,obra:obra,fecha:fecha,detalle:det,neto:neto,alicuota:document.getElementById('ve-ali').value,iva:iva,importe:neto+iva,cobrado:false});
  veTipoV='A';save();closePanel();render();toast('Factura de venta cargada');}

// ============ COBRANZAS Y PAGOS (multi-forma de pago) ============
// Una cobranza/pago junta varias formas de pago con su monto cada una; el sistema suma solo,
// genera los asientos en el libro (uno por forma), da de alta cheques recibidos en cartera,
// y el estado de la factura se deriva: Pendiente / Parcial (con saldo) / Cobrada-Pagada.
// La retencion tambien cancela factura: total imputado = formas de pago + retenciones.
// Formas de pago separadas como en el cuaderno de Direccion: bloque CHEQUES (renglones tipo
// planilla: tipo | numero | fecha | importe | banco) y bloque OTROS (transferencia, deposito
// de efectivo, efectivo, metros). En pagos los cheques son Endosado (cartera) o Propio (Galicia).
const CHQ_COB=['E-cheq','Cheque fisico'];
const CHQ_PAG=['Cheque en cartera','Cheque propio'];
const OTR_COB=['Transferencia','Dep. efectivo','Efectivo'];
const OTR_PAG=['Transferencia','Efectivo SG','Efectivo CM'];
const CHQ_LBL={'E-cheq':'E-cheq','Cheque fisico':'Fisico','Cheque en cartera':'Endosado (cartera)','Cheque propio':'Propio Galicia'};
let cf=null; // contexto del form abierto {tipo:'cobranza'|'pago', formas:[...]}
function esFormaCheque(m){return m==='E-cheq'||m==='Cheque fisico'||m==='Cheque propio'||m==='Cheque en cartera';}
function cfRender(){const el=document.getElementById('cf-formas');if(!el)return;
  const esCob=cf.tipo==='cobranza';
  const CHQ=esCob?CHQ_COB:CHQ_PAG,OTR=esCob?OTR_COB:OTR_PAG;
  const cartera=S.cheques.filter(c=>c.estado==='En cartera');
  // Un cheque de cartera solo puede salir una vez: el elegido en un renglon no se ofrece en otro
  const usados=cf.formas.map(x=>x&&x.chequeId).filter(Boolean);
  const chqIdx=[],otrIdx=[];
  cf.formas.forEach(function(f,i){(esFormaCheque(f.metodo)?chqIdx:otrIdx).push(i);});
  // --- bloque Cheques: un renglon por cheque, como la planilla del cuaderno ---
  const chqRows=chqIdx.map(function(i){const f=cf.formas[i];
    const tipoSel='<select onchange="cfMetodo('+i+',this.value)" title="Tipo de cheque">'+CHQ.map(m=>'<option value="'+m+'"'+(f.metodo===m?' selected':'')+'>'+CHQ_LBL[m]+'</option>').join('')+'</select>';
    const del='<button type="button" class="chqdel" title="Quitar" onclick="cfDel('+i+')">&times;</button>';
    if(f.metodo==='Cheque en cartera')
      return '<div class="chqrow"><div class="chqr1">'+tipoSel+'<div class="chqspan"><select onchange="cfCartera('+i+',this.value)"><option value="">Elegi que cheque de cartera sale...</option>'+
        cartera.filter(c=>c.id===f.chequeId||usados.indexOf(c.id)<0).map(c=>'<option value="'+c.id+'"'+(f.chequeId===c.id?' selected':'')+'>'+esc(c.numero)+' '+esc(c.banco)+' - '+money(c.importe)+'</option>').join('')+'</select></div>'+del+'</div></div>';
    const banco=(f.metodo==='Cheque propio')?'<span class="muted" style="font-size:12px;text-align:center">GALICIA</span>'
      :'<input value="'+esc(f.banco||'')+'" oninput="cfSet('+i+',\'banco\',this.value)" placeholder="Banco">';
    return '<div class="chqrow"><div class="chqr1">'+tipoSel+
      '<input value="'+esc(f.numero||'')+'" oninput="cfSet('+i+',\'numero\',this.value)" placeholder="N cheque">'+banco+del+'</div>'+
      '<div class="chqr2"><input type="date" value="'+(f.fechaCh||'')+'" onchange="cfSet('+i+',\'fechaCh\',this.value)" title="Fecha del cheque (si es diferido, la de cobro)">'+
      '<input inputmode="decimal" value="'+(f.monto?fmtImp(cfMonto(f)):'')+'" oninput="cfSet('+i+',\'monto\',this.value)" placeholder="Importe"></div></div>';}).join('');
  const bulkUI=(esCob&&cf.bulkOpen)?'<div class="field" style="margin:10px 0 0"><label>Un cheque por linea</label>'+
    '<textarea id="cf-bulk-ta" rows="5" style="width:100%;font-family:var(--mono);font-size:12px" placeholder="numero ; importe ; fecha ; banco&#10;00112233 ; 150000 ; 15/03/2026 ; GALICIA&#10;00112234 ; 200000 ; 30/03/2026" oninput="cf.bulkTexto=this.value">'+esc(cf.bulkTexto||'')+'</textarea>'+
    '<div class="hint">Formato: <span class="codebox">numero ; importe ; fecha ; banco</span> - numero, importe y fecha obligatorios; banco opcional (queda E-CHEQ). Podes pegar las columnas directo desde un Excel (con tab tambien sirve). Entran como E-cheq; si alguno es fisico, cambiale el tipo en su renglon.</div>'+
    '<div style="margin-top:8px"><button class="btn sm primary" onclick="cfBulkProcesar()">Agregar estos cheques</button></div>'+
    (cf.bulkErr?'<div class="form-msg show" style="margin-top:8px">'+esc(cf.bulkErr)+'</div>':'')+'</div>':'';
  const bloqueChq='<div class="cfblock"><div class="cfbt">Cheques<span class="spacer"></span>'+
    '<button type="button" class="btn ghost sm" onclick="cfAddCheque()">+ Agregar cheque</button>'+
    (esCob?'<button type="button" class="btn ghost sm" onclick="cf.bulkOpen=!cf.bulkOpen;cfRender()">'+(cf.bulkOpen?'Cerrar carga masiva':'Son muchos? Pegalos juntos')+'</button>':'')+'</div>'+
    (chqIdx.length?chqRows:'<div class="hint">Sin cheques en esta operacion. Agrega un renglon por cheque.</div>')+bulkUI+
    (chqIdx.length?'<div class="hint" style="margin-top:6px">'+(esCob?'Los cheques recibidos entran solos a cartera.':'Endosado: sale un cheque de cartera. Propio: Galicia, debita en la fecha del cheque y queda en el cuadro de cheques propios.')+'</div>':'')+'</div>';
  // --- bloque Otros: transferencia / depositos / efectivo / metros ---
  const otrRows=otrIdx.map(function(i){const f=cf.formas[i];
    let hint='';
    if(f.metodo==='Dep. efectivo')hint='Entra al Banco Galicia como deposito en efectivo.';
    if(f.metodo==='Efectivo')hint=esCob?'⚠ A definir con Direccion a que caja entra. Por ahora va a Efectivo general.':'';
    return '<div class="otrrow"><select onchange="cfMetodo('+i+',this.value)">'+OTR.map(m=>'<option'+(f.metodo===m?' selected':'')+'>'+m+'</option>').join('')+'</select>'+
      '<input inputmode="decimal" value="'+(f.monto?fmtImp(cfMonto(f)):'')+'" oninput="cfSet('+i+',\'monto\',this.value)" placeholder="Importe">'+
      '<button type="button" class="chqdel" title="Quitar" onclick="cfDel('+i+')">&times;</button></div>'+
      (hint?'<div class="hint" style="margin:-2px 0 8px">'+hint+'</div>':'');}).join('');
  const bloqueOtr='<div class="cfblock"><div class="cfbt">Otros<span class="spacer"></span>'+
    '<button type="button" class="btn ghost sm" onclick="cfAdd()">+ Agregar otra forma</button></div>'+
    (otrIdx.length?otrRows:'<div class="hint">Transferencia, '+(esCob?'deposito de efectivo o efectivo':'efectivo de caja chica SG o CM')+'.</div>')+'</div>';
  setHTML(el,bloqueChq+bloqueOtr);
  cfTotales();}
function cfSet(i,k,v){cf.formas[i][k]=(k==='monto')?num(v):v;if(k==='monto')cfTotales();}
// Cambiar el metodo NO pisa lo ya tipeado: conserva importe (y datos del cheque si sigue
// siendo cheque). Antes se reseteaba el renglon entero y el total quedaba corto.
function cfMetodo(i,v){const o=cf.formas[i]||{};const f={metodo:v};
  if(v!=='Cheque en cartera'){
    if(o.monto)f.monto=cfMonto(o);
    if(esFormaCheque(v)&&esFormaCheque(o.metodo)){
      if(o.numero)f.numero=o.numero;if(o.fechaCh)f.fechaCh=o.fechaCh;
      if(o.banco&&v!=='Cheque propio')f.banco=o.banco;}}
  cf.formas[i]=f;cfRender();}
function cfAdd(){cf.formas.push({metodo:'Transferencia'});cfRender();}
function cfAddCheque(){cf.formas.push({metodo:cf.tipo==='cobranza'?'E-cheq':'Cheque en cartera'});cfRender();}
function cfDel(i){cf.formas.splice(i,1);cfRender();}
function cfCartera(i,chId){const ch=S.cheques.find(x=>x.id===chId);cf.formas[i].chequeId=chId||null;
  // importe siempre numerico: si el cheque viene de datos viejos con el importe como texto, se convierte
  cf.formas[i].monto=ch?(typeof ch.importe==='number'?ch.importe:num(ch.importe)):0;cfRender();}
// Carga masiva: una linea por cheque "numero ; importe ; fecha ; banco" (tab o ; como separador).
// Cada linea valida se agrega como un renglon mas del bloque Cheques.
function cfFechaCh(s){s=(s||'').trim();if(!s)return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const m=s.match(/^(\d{1,2})\D(\d{1,2})\D(\d{2,4})$/);if(!m)return '';
  const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);}
function cfBulkProcesar(){
  // Leer el texto directo del textarea: en algunos celulares el oninput no llega a guardar
  // lo tipeado antes de tocar el boton, y parecia que "no habia ninguna linea".
  const ta=document.getElementById('cf-bulk-ta');if(ta)cf.bulkTexto=ta.value;
  const lines=(cf.bulkTexto||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const malas=[];let n=0;
  lines.forEach(function(l,idx){const p=l.split(/[;:\t]/).map(x=>x.trim());
    const numero=p[0]||'';const importe=num(p[1]||'');const fecha=cfFechaCh(p[2]);
    if(!numero||!importe||!fecha){malas.push(idx+1);return;}
    cf.formas.push({metodo:'E-cheq',numero:numero,monto:importe,fechaCh:fecha,banco:(p[3]||'E-CHEQ').toUpperCase()});n++;});
  cf.bulkErr=malas.length?('Lineas '+malas.join(', ')+': falta numero, importe o fecha (los tres son obligatorios), no se tomaron.'):(n?'':'Escribi al menos una linea con numero ; importe ; fecha y toca "Agregar estos cheques".');
  if(n){cf.bulkTexto='';if(!malas.length)cf.bulkOpen=false;}
  cfRender();
  if(n)toast(n+' cheques agregados');}
function cfMonto(f){return typeof f.monto==='number'?(f.monto||0):num(f.monto);}
function cfSumFormas(){return cf.formas.reduce((a,f)=>a+cfMonto(f),0);}
function cfSumRet(){if(cf.tipo!=='cobranza')return 0;return ['gan','iibb','suss'].reduce((a,k)=>{const e=document.getElementById('cf-ret-'+k);return a+(e?num(e.value):0);},0);}
function cfTotales(){const fp=cfSumFormas(),rt=cfSumRet();
  const a=document.getElementById('cf-tot-plata'),b=document.getElementById('cf-tot-ret'),c=document.getElementById('cf-tot-imp');
  if(a)a.textContent=money(fp);if(b)b.textContent=money(rt);if(c)c.textContent=money(fp+rt);}

// Con el cliente/proveedor elegido, el select de factura muestra SOLO sus facturas
// (pedido Direccion 01/09: aparecian todas y daba lugar a error). Vacio o sin match: todas.
function cfFacOpts(){const sel=document.getElementById('cf-factura'),inp=document.getElementById('cf-cliente');if(!sel||!inp||!cf)return;
  const cur=sel.value;const q=(inp.value||'').trim().toLowerCase();
  const esCob=cf.tipo==='cobranza';
  let list=esCob?S.ventas.filter(v=>!v.cobrado||v.id===cur):S.compras.filter(c=>!c.pagado||c.id===cur);
  if(q&&q!=='otro'){
    if(esCob){
      // cliente exacto de la lista: filtro estricto aunque quede vacio (no mostrar facturas ajenas)
      const exacto=S.clientes.some(c=>(c.nombre||'').toLowerCase()===q)||S.ventas.some(v=>(v.cliente||'').toLowerCase()===q);
      if(exacto)list=list.filter(v=>(v.cliente||'').toLowerCase()===q);
      else{const m=list.filter(v=>(v.cliente||'').toLowerCase().includes(q));if(m.length)list=m;}}
    else{const provs=S.proveedores.concat(S.contratistas);
      const cod=(codigoDesdeInput(inp.value)||'').toLowerCase();
      // filtro estricto solo si el codigo es real (elegido de la lista); tipeando a medias, filtro suave
      if(cod&&provs.some(p=>(p.codigo||'').toLowerCase()===cod))list=list.filter(c=>(c.proveedor||'').toLowerCase()===cod);
      else{const m=list.filter(c=>{const n=(nombrePorCodigo(c.proveedor)||c.proveedor||'').toLowerCase();return n.includes(q)||q.includes(n);});if(m.length)list=m;}}}
  setHTML(sel,'<option value="">Sin factura puntual</option>'+list.map(x=>esCob
    ?'<option value="'+x.id+'">Fc '+esc(x.numero)+' ('+(x.tipo||'A')+') - '+esc(x.cliente)+' - debe '+money(x.importe-(x.cobradoMonto||0))+'</option>'
    :'<option value="'+x.id+'">Fc '+esc(x.numero)+' - '+esc(nombrePorCodigo(x.proveedor)||x.proveedor)+' - debe '+money(x.importe-(x.pagadoMonto||0))+(x.remito?'':' [SIN REMITO]')+'</option>').join(''));
  sel.value=cur;if(sel.value!==cur)sel.value='';}

    '<div class="field"><label>Cliente <span class="req">*</span></label><input id="cf-cliente" list="cf-cli-list" value="'+esc(fac?fac.cliente:'')+'" placeholder="Escribi y elegi de la lista" oninput="cfFacOpts()">'+
      '<datalist id="cf-cli-list"><option value="Otro"></option>'+S.clientes.map(c=>'<option value="'+esc(c.nombre)+'"></option>').join('')+'</datalist></div>'+
    '<div class="field"><label>Factura vinculada</label><select id="cf-factura">'+fopts+'</select><div class="hint">Con el cliente elegido, aca aparecen solo sus facturas. Lo cobrado se imputa a esta factura. Si es a cuenta sin factura, dejalo vacio: queda en la cuenta corriente del cliente.</div></div>'+

    '<div class="hint" style="margin-top:9px">Genera los asientos en Movimientos (uno por forma de pago), los cheques entran a cartera y el estado de la factura se actualiza solo. Se corrige anulando la cobranza completa.</div></div>');
  cfRender();cfFacOpts();
  sugiere('cf-cliente',()=>['Otro'].concat(S.clientes.map(c=>c.nombre)),cfFacOpts);}
function saveCobranza(){const msg=document.getElementById('cf-msg');const errs=[];
  const fecha=document.getElementById('cf-fecha').value;let cliente=document.getElementById('cf-cliente').value.trim();
  // Cliente contra el maestro: un typo o mayusculas distintas crearian una cta cte paralela.
  // Si coincide (sin importar mayusculas/acentos) se normaliza al nombre del maestro.
  if(cliente&&cliente!=='Otro'){const cli=S.clientes.find(c=>normTxt(c.nombre)===normTxt(cliente));
    if(cli)cliente=cli.nombre;
    else errs.push('El cliente "'+cliente+'" no esta en el maestro: elegilo de la lista, cargalo en Clientes o usa "Otro"');}
  const rubro=document.getElementById('cf-rubro').value,aclar=document.getElementById('cf-aclar').value.trim();
  const facId=document.getElementById('cf-factura').value||null;
  cf.formas.forEach(f=>{f.monto=cfMonto(f);});
  const formas=cf.formas.filter(f=>(f.monto||0)>0);
  if(!fecha)errs.push('Falta la fecha');if(!cliente)errs.push('Falta el cliente');
  if(!formas.length)errs.push('Carga al menos una forma de pago con monto');
  // Un cheque no entra sin todos sus datos (pedido Direccion 01/09): numero, importe y fecha
  // siempre; banco solo obligatorio en cheque fisico (el e-cheq queda como E-CHEQ).
  // Un renglon de cheque vacio tampoco pasa: o se completa o se quita con la x.
  // Y numero+banco repetido (en esta cobranza o ya cargado) tampoco: cheque duplicado = error.
  const chkVistos={};
  cf.formas.forEach(f=>{if(f.metodo==='E-cheq'||f.metodo==='Cheque fisico'){
    const falta=[];
    if(!f.numero)falta.push('el numero');
    if(!(cfMonto(f)>0))falta.push('el importe');
    if(!f.fechaCh)falta.push('la fecha');
    if(f.metodo==='Cheque fisico'&&!f.banco)falta.push('el banco');
    if(falta.length){const vacio=!f.numero&&!(cfMonto(f)>0)&&!f.fechaCh&&!f.banco;
      errs.push(vacio?'Hay un renglon de cheque sin completar: cargale numero, importe y fecha, o quitalo con la x'
        :'Al '+f.metodo.toLowerCase()+' '+(f.numero?'N '+f.numero:'sin numero')+' le falta '+falta.join(', '));return;}
    const numk=(f.numero||'').trim(),bank=(f.banco||(f.metodo==='E-cheq'?'E-CHEQ':'')).trim().toUpperCase();
    const k=numk+'|'+bank;
    if(chkVistos[k])errs.push('El cheque N '+f.numero+' ('+bank+') esta repetido en esta cobranza');
    chkVistos[k]=1;
    if(S.cheques.some(c=>c.estado!=='Anulado'&&(c.numero||'').trim()===numk&&((c.banco||'')+'').trim().toUpperCase()===bank))
      errs.push('El cheque N '+f.numero+' ('+bank+') ya esta cargado en el sistema');}});
  if(errs.length){msg.className='form-msg show';msg.textContent=errs.join(' - ');return;}
  const ret={gan:num(document.getElementById('cf-ret-gan').value),iibb:num(document.getElementById('cf-ret-iibb').value),suss:num(document.getElementById('cf-ret-suss').value)};

  const fac=facId?S.ventas.find(v=>v.id===facId):null;
  const base='Cobranza '+cliente+(fac?' - Fc '+fac.numero:'')+(cf.concepto==='Saldo'?' (saldo)':' (a cuenta)');
  formas.forEach(function(f){
    if(f.metodo==='Transferencia')S.movimientos.push({id:uid(),orden:Date.now()+Math.random(),fecha:fecha,concepto:base,detalle:[aclar,'Transferencia'].filter(Boolean).join(' - '),codigo:'',rubro:rubro,medio:'Banco Galicia',monto:f.monto,signo:'ingreso',concil:false,ret:null,cobranzaId:cob.id});
    else if(f.metodo==='Dep. efectivo')S.movimientos.push({id:uid(),orden:Date.now()+Math.random(),fecha:fecha,concepto:base,detalle:[aclar,'Deposito en efectivo'].filter(Boolean).join(' - '),codigo:'',rubro:rubro,medio:'Banco Galicia',monto:f.monto,signo:'ingreso',concil:false,ret:null,cobranzaId:cob.id});
    else if(f.metodo==='Efectivo')S.movimientos.push({id:uid(),orden:Date.now()+Math.random(),fecha:fecha,concepto:base,detalle:[aclar,'Efectivo (caja a definir)'].filter(Boolean).join(' - '),codigo:'',rubro:rubro,medio:'Efectivo',monto:f.monto,signo:'ingreso',concil:false,ret:null,cobranzaId:cob.id});
    else if(f.metodo==='Metros')S.cajam.push({id:uid(),fecha:fecha,tipo:'Metros',signo:'ingreso',concepto:base,detalle:aclar,monto:f.monto,cobranzaId:cob.id});
    else S.cheques.unshift({id:uid(),recibido:fecha,origen:cliente,banco:f.banco||(f.metodo==='E-cheq'?'E-CHEQ':''),numero:f.numero||'',importe:f.monto,vto:f.fechaCh||'',destino:'',egreso:'',estado:'En cartera',cobranzaId:cob.id});
  });
  S.cobranzas.unshift(cob);
  lastFecha=fecha;save();closePanel();render();toast('Cobranza registrada: asientos, cheques y estado de factura actualizados');}
function anularCobranza(id){const c=S.cobranzas.find(x=>x.id===id);if(!c||c.anulado)return;
  const chs=S.cheques.filter(ch=>ch.cobranzaId===id);
  if(chs.some(ch=>ch.estado!=='En cartera'&&ch.estado!=='Anulado')){toast('Un cheque de esta cobranza ya se deposito o endoso: anula primero ese movimiento');return;}
  if(!confirm('Anular esta cobranza completa?\n\nSe asientan los contra-movimientos, los cheques que habian entrado quedan anulados y la factura recupera su saldo.'))return;

  chs.forEach(ch=>{if(ch.estado==='En cartera')ch.estado='Anulado';});

    S.cajam.push({id:uid(),fecha:e.fecha,tipo:e.tipo,signo:(e.signo==='ingreso'?'egreso':'ingreso'),concepto:'ANULACION: '+e.concepto,detalle:e.detalle,monto:e.monto,anulaDe:e.id});});

function savePago(){const msg=document.getElementById('cf-msg');const errs=[];
  const fecha=document.getElementById('cf-fecha').value;const provRaw=document.getElementById('cf-cliente').value.trim();
  const prov=codigoDesdeInput(provRaw);const rubro=document.getElementById('cf-rubro').value;
  // Proveedor contra el maestro: texto libre crearia una cta cte paralela por typo.
  if(provRaw&&!S.proveedores.concat(S.contratistas).some(p=>normTxt(p.codigo)===normTxt(prov)))
    errs.push('El proveedor no esta en el maestro: elegilo de la lista (se carga en Maestros)');
  const aclar=document.getElementById('cf-aclar').value.trim();const obra=document.getElementById('cf-obra').value.trim();
  const facId=document.getElementById('cf-factura').value||null;
  cf.formas.forEach(f=>{f.monto=cfMonto(f);});
  const formas=cf.formas.filter(f=>(f.monto||0)>0);
  if(!fecha)errs.push('Falta la fecha');if(!provRaw)errs.push('Falta el proveedor');
  if(!formas.length)errs.push('Carga al menos una forma de pago con monto');
  // Cheque propio: numero, importe y fecha obligatorios (debita en la fecha del cheque).
  // Renglon vacio no pasa: se completa o se quita con la x.
  // El mismo cheque de cartera no puede salir dos veces en el mismo pago (se contaria doble).
  const cartIds=cf.formas.filter(f=>f.metodo==='Cheque en cartera'&&f.chequeId).map(f=>f.chequeId);
  if(new Set(cartIds).size!==cartIds.length)errs.push('Elegiste el mismo cheque de cartera en dos renglones: un cheque sale una sola vez');
  const propiosVistos={};
  cf.formas.forEach(f=>{if(f.metodo==='Cheque en cartera'&&!f.chequeId)errs.push('Elegi que cheque de cartera sale (o quita el renglon con la x)');
    if(f.metodo==='Cheque propio'){const falta=[];
      if(!f.numero)falta.push('el numero');
      if(!(cfMonto(f)>0))falta.push('el importe');
      if(!f.fechaCh)falta.push('la fecha (ese dia debita de Galicia)');
      if(falta.length){const vacio=!f.numero&&!(cfMonto(f)>0)&&!f.fechaCh;
        errs.push(vacio?'Hay un renglon de cheque propio sin completar: cargale numero, importe y fecha, o quitalo con la x'
          :'Al cheque propio '+(f.numero?'N '+f.numero:'sin numero')+' le falta '+falta.join(', '));return;}
      // Numero de cheque propio repetido = error contable (mismo talonario Galicia)
      const k=(f.numero||'').trim();
      if(propiosVistos[k])errs.push('El cheque propio N '+f.numero+' esta repetido en este pago');
      propiosVistos[k]=1;
      if((S.chequesPropios||[]).some(c=>!c.anulado&&(c.numero||'').trim()===k))errs.push('El cheque propio N '+f.numero+' ya esta cargado en el cuadro de cheques propios');}});
  if(errs.length){msg.className='form-msg show';msg.textContent=errs.join(' - ');return;}
  const pago={id:uid(),fecha:fecha,proveedor:prov,factura:facId,concepto:cf.concepto,aclar:aclar,obra:obra,rubro:rubro,formas:formas,imputado:formas.reduce((a,f)=>a+f.monto,0)};
  const fac=facId?S.compras.find(c=>c.id===facId):null;
  const nom=nombrePorCodigo(prov)||provRaw;
  const base='Pago '+nom+(fac?' - Fc '+fac.numero:'')+(cf.concepto==='Saldo'?' (saldo)':' (a cuenta)');
  const det=[aclar,obra?('Obra '+obra):''].filter(Boolean).join(' - ');
  formas.forEach(function(f){
    if(f.metodo==='Transferencia')S.movimientos.push({id:uid(),orden:Date.now()+Math.random(),fecha:fecha,concepto:base,detalle:det,codigo:prov,rubro:rubro,medio:'Banco Galicia',monto:f.monto,signo:'egreso',concil:false,ret:null,cobranzaId:pago.id});
    else if(f.metodo==='Efectivo SG'||f.metodo==='Efectivo CM')S.movimientos.push({id:uid(),orden:Date.now()+Math.random(),fecha:fecha,concepto:base,detalle:[det,'Caja chica '+f.metodo.slice(-2)].filter(Boolean).join(' - '),codigo:prov,rubro:rubro,medio:'Efectivo',monto:f.monto,signo:'egreso',concil:false,ret:null,cobranzaId:pago.id});
    else if(f.metodo==='Cheque en cartera'){const ch=S.cheques.find(x=>x.id===f.chequeId);
      const mv={id:uid(),orden:Date.now()+Math.random(),fecha:fecha,concepto:base,detalle:[det,'Endoso cheque '+(ch?ch.numero:'')].filter(Boolean).join(' - '),codigo:prov,rubro:rubro,medio:'Cheque',monto:f.monto,signo:'egreso',concil:false,ret:null,cobranzaId:pago.id};
      S.movimientos.push(mv);if(ch){ch.estado='Endosado';ch.egreso=fecha;ch.destino=nom+' ('+prov+')';ch.movId=mv.id;}}
    else if(f.metodo==='Cheque propio'){
      const mv={id:uid(),orden:Date.now()+Math.random(),fecha:f.fechaCh||fecha,concepto:base,detalle:[det,'Cheque propio Galicia N '+f.numero+' - debita a fecha del cheque'].filter(Boolean).join(' - '),codigo:prov,rubro:rubro,medio:'Banco Galicia',monto:f.monto,signo:'egreso',concil:false,ret:null,cobranzaId:pago.id};
      S.movimientos.push(mv);
      S.chequesPropios.unshift({id:uid(),fecha:f.fechaCh||fecha,numero:f.numero,importe:f.monto,destino:nom+' ('+prov+')',pagoId:pago.id,movId:mv.id});}
  });
  S.pagos.unshift(pago);
  lastFecha=fecha;save();closePanel();render();toast('Pago registrado: asientos y estado de factura actualizados');}
function anularPago(id){const p=S.pagos.find(x=>x.id===id);if(!p||p.anulado)return;
  if(!confirm('Anular este pago completo?\n\nSe asientan los contra-movimientos, los cheques endosados vuelven a cartera, los propios quedan anulados y la factura recupera su saldo.'))return;
  S.movimientos.filter(m=>m.cobranzaId===id&&movActivo(m)).forEach(anularMovSilent);
  (S.chequesPropios||[]).forEach(c=>{if(c.pagoId===id)c.anulado=true;});
  p.anulado=true;
  save();render();toast('Pago anulado con contra-movimientos');}

function formasResumen(formas){const g={},ord=[];
  formas.forEach(f=>{const k=f.metodo;if(!g[k]){g[k]={n:0,m:0};ord.push(k);}g[k].n+=(f.lote?f.lote.length:1);g[k].m+=f.monto||0;});
  return ord.map(k=>k+(g[k].n>1?' x'+g[k].n:'')+' '+money(g[k].m)).join(' + ');}
function facNum(id,esVenta){const f=(esVenta?S.ventas:S.compras).find(x=>x.id===id);return f?f.numero:'';}

  else{S.compras.filter(c=>c.proveedor===cod).forEach(c=>items.push({fecha:c.fecha,tipo:'Factura '+c.numero,det:c.detalle||'',debe:c.importe,haber:0}));
    S.pagos.filter(p=>!p.anulado&&p.proveedor===cod).forEach(p=>items.push({fecha:p.fecha,tipo:'Pago'+(p.factura?' Fc '+facNum(p.factura,false):''),det:[p.concepto,p.aclar,formasResumen(p.formas)].filter(Boolean).join(' - '),debe:0,haber:p.imputado}));}
  items=items.filter(x=>enRango(x.fecha,d1,d2)).sort((a,b)=>a.fecha<b.fecha?-1:1);
  let saldo=0;const rows=items.map(function(x){saldo+=x.debe-x.haber;
    return '<tr><td class="num muted">'+fdate(x.fecha)+'</td><td><b style="font-weight:560">'+esc(x.tipo)+'</b>'+(x.det?'<div class="muted" style="font-size:11.5px">'+esc(x.det)+'</div>':'')+'</td>'+

// ============ ACOPIOS ============
// v2 05/09 (pedido Direccion via Facturacion): acopio por articulo, "que se vea cuanto queda de producto y de plata".
// La lista de precios del proveedor (la planilla que arma Facturacion, ej. AWADUCT) se sube en Excel y queda
// en localStorage: es la lista publica del proveedor, no dato contable, asi no se resube cada sesion.
const LP_KEY='gtsa_lista_precios_v1';
let LISTA=null;
try{const _lp=localStorage.getItem(LP_KEY);if(_lp)LISTA=JSON.parse(_lp);}catch(e){}
function fmtCant(n){return new Intl.NumberFormat('es-AR',{maximumFractionDigits:2}).format(n||0);}
function itKey(x){return x.codigo||normTxt(x.articulo||'');}
function lpDisp(){if(!LISTA)return [];if(!LISTA._disp)LISTA._disp=LISTA.items.map(it=>it[0]+' - '+it[1]);return LISTA._disp;}
function lpFind(cod){if(!LISTA)return null;const it=LISTA.items.find(x=>x[0]===cod);return it?{codigo:it[0],articulo:it[1],precio:it[2]}:null;}
// Los importes del Excel pueden venir como numero o como texto en cualquier formato: tolerante, no estricto.
function numXls(v){if(typeof v==='number')return isFinite(v)?v:0;v=String(v==null?'':v).trim();if(!v)return 0;
  if(NUM_RE.test(v))return num(v);
  const f=parseFloat(v.replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));return isFinite(f)?f:0;}
function importarLista(input){const file=input.files&&input.files[0];if(!file)return;input.value='';lpLeerFile(file);}
function lpLeerFile(file){toast('Leyendo la lista...');
  ensureXLSX().then(XLSX=>{const rd=new FileReader();rd.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true});
    let hi=-1,ci=null;
    for(let i=0;i<Math.min(20,aoa.length);i++){const r=(aoa[i]||[]).map(c=>normNom(c));
      const cc=r.findIndex(h=>h.indexOf('CODIGO')>=0),ca=r.findIndex(h=>h.indexOf('ARTICULO')>=0||h.indexOf('DESCRIPCION')>=0);
      if(cc>=0&&ca>=0){let cp=-1;r.forEach(function(h,j){if(h.indexOf('ACOPIO')>=0)cp=j;});
        if(cp<0)r.forEach(function(h,j){if(h)cp=j;}); // sin columna "acopio": la ultima con encabezado
        ci={c:cc,a:ca,p:cp};hi=i;break;}}
    if(hi<0){toast('No encontre las columnas Codigo / Articulo en el archivo');return;}
    const items=[];
    for(let i=hi+1;i<aoa.length;i++){const r=aoa[i]||[];const cod=(r[ci.c]!=null?String(r[ci.c]):'').trim();if(!cod)continue;
      const pre=numXls(r[ci.p]);if(pre<=0)continue;
      items.push([cod,(r[ci.a]!=null?String(r[ci.a]):'').trim(),pre]);}
    if(!items.length){toast('El archivo no tiene articulos con precio');return;}
    LISTA={nombre:file.name.replace(/\.[^.]+$/,''),cargada:new Date().toISOString().slice(0,10),n:items.length,items:items};
    try{localStorage.setItem(LP_KEY,JSON.stringify(LISTA));}catch(err){toast('Ojo: la lista quedo cargada pero no se pudo guardar en el navegador; habra que subirla de nuevo la proxima vez');}
    render();toast(items.length+' articulos cargados con su precio de acopio');
  }catch(err){toast('No se pudo leer el archivo');}};rd.readAsArrayBuffer(file);})
  .catch(()=>toast('No se pudo cargar el lector de Excel (revisa la conexion a internet)'));}
function saldoAcopio(a){return a.total-(a.descuentos||[]).reduce((x,d)=>x+d.monto,0);}
function acRetirado(a,k){return (a.descuentos||[]).reduce((s,d)=>s+((d.items||[]).filter(x=>itKey(x)===k).reduce((y,x)=>y+x.cant,0)),0);}

        its.map(function(it){const ret=acRetirado(a,itKey(it));const q=it.cant-ret;
          return '<tr><td>'+(it.codigo?'<span class="codebox">'+esc(it.codigo)+'</span>':'<span class="muted">-</span>')+'</td><td>'+esc(it.articulo)+'</td><td class="r num">'+fmtCant(it.cant)+'</td><td class="r num">'+fmtCant(ret)+'</td><td class="r"><span class="chip '+(q>0?'pos':'warn')+'">'+fmtCant(q)+'</span></td><td class="r num">'+money(it.precio)+'</td></tr>';}).join('')+
        '</tbody></table></div>':'')+
      ((a.descuentos||[]).length?'<div class="tbl-wrap" style="margin-top:9px"><table><thead><tr><th>Fecha</th><th>Remito</th><th>Detalle</th><th class="r">Monto</th></tr></thead><tbody>'+
        a.descuentos.map(function(d){const det=(d.items&&d.items.length?d.items.map(x=>fmtCant(x.cant)+' x '+(x.articulo||x.codigo)).join(' - '):'')+(d.detalle?(d.items&&d.items.length?' - ':'')+d.detalle:'');
          return '<tr><td class="num muted">'+fdate(d.fecha)+'</td><td><span class="codebox">'+esc(d.remito||'-')+'</span></td><td class="muted">'+esc(det)+'</td><td class="r num amt neg">'+money(d.monto)+'</td></tr>';}).join('')+
        '</tbody></table></div>':'<div class="muted" style="font-size:12px;margin-top:7px">Sin desacopios todavia.</div>')+'</div>';}).join('')
    :'<div class="empty">Sin acopios cargados.</div>')+'</div>');}

  openPanel('<div class="panel-head"><h2>Nuevo acopio</h2><div class="spacer"></div><button class="btn ghost sm" onclick="closePanel()">x</button></div>'+
  '<div class="panel-body"><div class="form-msg" id="ac-msg"></div>'+
    '<div class="field"><label>Proveedor <span class="req">*</span></label><input id="ac-prov" placeholder="Escribi para buscar..." autocomplete="off"></div>'+
    '<div class="row2"><div class="field"><label>Fecha <span class="req">*</span></label><input type="date" id="ac-fecha" value="'+ultimaFecha()+'"></div>'+
      '<div class="field"><label>Detalle</label><input id="ac-det" placeholder="Que se acopio"></div></div>'+
    '<div class="field"><label>Articulos acopiados'+(LISTA?'':' (sin lista de precios: articulo y precio a mano)')+'</label><div id="ac-rows"></div>'+
