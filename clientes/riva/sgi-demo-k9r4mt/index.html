<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Riva · Sistema de Gestión Integrada</title>
<meta name="description" content="Maqueta Argos · Sistema de Gestión Integrada (ISO 9001 · 14001 · 45001). Datos de ejemplo.">
<link rel="icon" type="image/png" href="assets/favicon.png?v=7">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=7">
<script src="tema-inicial.js?v=7"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Menú principal">
    <a class="brand" href="#/panel" aria-label="Riva · Inicio">
      <img class="logo logo-claro" src="assets/riva-navy.png" alt="Riva" width="86" height="36">
      <img class="logo logo-oscuro" src="assets/riva-blanco.png" alt="Riva" width="86" height="36">
      <span class="brand-sub">Sistema de Gestión Integrada</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <a class="argos-sello" href="https://argos.dilemacreative.ar/?utm_source=sistema-riva&amp;utm_medium=watermark" target="_blank" rel="noopener" title="Sistema a medida de Argos · Dilema">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle class="a-r1" cx="24" cy="24" r="22.4"/><circle class="a-r2" cx="24" cy="24" r="13.7"/><circle class="a-iris" cx="24" cy="24" r="7.2"/></svg>
      <span class="a-txt"><b>Argos</b><span>Sistema a medida · Dilema</span></span>
    </a>
  </aside>
  <div class="velo" id="velo" data-accion="cerrar-menu"></div>

  <div class="main">
    <header class="topbar">
      <button type="button" class="btn icon ghost solo-movil" data-accion="abrir-menu" aria-label="Abrir menú"><i class="ph ph-list"></i></button>
      <div class="quick" role="group" aria-label="Acciones rápidas">
        <button type="button" class="btn primary" data-accion="nueva-fua"><i class="ph ph-plus"></i><span>Nueva acción (FUA)</span></button>
      </div>
      <button type="button" class="buscador-global" data-accion="paleta" aria-label="Buscar en todo el sistema (Ctrl K)">
        <i class="ph ph-magnifying-glass"></i><span>Buscar o ir a…</span><kbd>Ctrl K</kbd>
      </button>
      <nav class="atajos" aria-label="Accesos">
        <a href="#/documentos">Documentos</a>
        <a href="#/fua">Acciones</a>
        <a href="#/obras">Obras</a>
      </nav>
      <span class="pill-maqueta" title="Maqueta navegable con datos de ejemplo">Maqueta · Datos de ejemplo</span>
      <button type="button" class="btn icon ghost" data-accion="tema" aria-label="Cambiar tema"><i class="ph ph-moon tema-luna"></i><i class="ph ph-sun tema-sol"></i></button>
      <div class="usuario" title="Gestión de Calidad">GC</div>
    </header>
    <main id="vista" tabindex="-1"></main>
  </div>
</div>

<div class="drawer-wrap" id="drawer-wrap" aria-hidden="true">
  <div class="drawer-velo" data-accion="cerrar-drawer"></div>
  <section class="drawer" id="drawer" role="dialog" aria-modal="true" tabindex="-1"></section>
</div>
<div class="modal-wrap" id="modal-wrap" aria-hidden="true">
  <div class="modal-velo" data-accion="cerrar-modal"></div>
  <section class="modal" id="modal" role="dialog" aria-modal="true" tabindex="-1"></section>
</div>
<div class="paleta-wrap" id="paleta-wrap" aria-hidden="true">
  <div class="paleta-velo" data-accion="cerrar-paleta"></div>
  <div class="paleta" id="paleta" role="dialog" aria-modal="true" aria-label="Buscar en el sistema">
    <div class="paleta-in"><i class="ph ph-magnifying-glass"></i><input type="text" id="busqueda-global" placeholder="Buscá documentos, FUAs, obras, proveedores o acciones" autocomplete="off" aria-controls="resultados-global"><kbd>Esc</kbd></div>
    <div class="resultados" id="resultados-global" role="listbox"></div>
    <div class="paleta-pie"><span><kbd>↑</kbd><kbd>↓</kbd> moverse</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> cerrar</span></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
