<style>
:root{

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:linear-gradient(180deg,#ffffff 0%,#e9eff8 100%);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}

header{border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(12px)}
.nav{display:flex;align-items:center;height:74px}
.logo{height:38px;width:auto}
.logo-link{position:relative;display:inline-flex;align-items:center}
.logo-dot{position:absolute;left:49%;top:13%;width:6px;height:6px;border-radius:50%;background:linear-gradient(90deg,#3b48ff,#3b48ff,#5bfff7,#f07fff,#ffd447,#ffd447,#21c472,#01013d,#030314);background-size:600% 600%;animation:gradientShift 8s ease-in-out infinite;z-index:2}
@keyframes gradientShift{0%{background-position:0% 50%}33%{background-position:50% 100%}66%{background-position:100% 50%}100%{background-position:0% 50%}}

main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:64px 0}
.check{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--mid2));display:flex;align-items:center;justify-content:center;margin:0 auto 28px;box-shadow:0 18px 40px rgba(68,163,155,.35)}
.check svg{width:44px;height:44px;color:#fff}
h1{font-weight:800;font-size:clamp(1.9rem,5vw,2.7rem);color:var(--navy);text-transform:uppercase;letter-spacing:-.01em;margin-bottom:1rem}
.lead{font-size:1.15rem;color:var(--muted);max-width:46ch;margin:0 auto 2rem}
.lead b{color:var(--blue)}
.cta{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.6rem;font-family:'Poppins';font-weight:700;font-size:1rem;padding:.9rem 1.7rem;border-radius:14px;transition:.2s;border:none;cursor:pointer}
.btn svg{width:20px;height:20px}
.btn-wa{background:var(--teal);color:#fff;box-shadow:0 10px 24px rgba(68,163,155,.32)}
.btn-wa:hover{background:#3a8f88;transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--navy);border:2px solid var(--line)}
.btn-ghost:hover{border-color:var(--mid2);color:var(--action)}

footer{text-align:center;padding:26px 0;font-size:.84rem;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:480px){
  .nav{height:62px}.logo{height:30px}.logo-dot{left:48.5%;top:12%;width:5px;height:5px}
  main{padding:44px 0}
  .cta{flex-direction:column}
  .cta .btn{width:100%;justify-content:center}
}
</style>
