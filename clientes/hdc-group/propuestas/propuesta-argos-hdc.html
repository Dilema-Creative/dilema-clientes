<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<meta name="referrer" content="no-referrer">
<title>Documento</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--tx:#14202b;--mu:#5b6876;--bd:#dfe3e8;--ac:#1e9c82;--err:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#070d17;--card:#0f1724;--tx:#e8edf3;--mu:#93a1b1;--bd:#1f2a3a;--ac:#5cc79d;--err:#fb923c}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px}
h1{font-size:20px;font-weight:600;margin-bottom:6px}
p{color:var(--mu);font-size:14px;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx)}
input:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:transparent}
button{width:100%;margin-top:14px;font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--err);font-size:13px;min-height:20px;margin-top:10px}
.pie{font-size:12px;color:var(--mu);margin-top:16px;text-align:center}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Documento protegido</h1>
  <p>Ingresá la clave que te pasamos para verlo.</p>
  <label for="c">Clave</label>
  <input id="c" type="password" required autofocus autocomplete="current-password">
  <button id="b" type="submit">Abrir</button>
  <div class="err" id="e" role="alert"></div>
  <div class="pie">Dilema creative · contenido cifrado</div>
</form>
<script>
(function () {
  var K = "a1", f = document.getElementById('f'), c = document.getElementById('c'), b = document.getElementById('b'), e = document.getElementById('e');
  function guardada() { try { return sessionStorage.getItem(K); } catch (x) { return null; } }
  function mostrar(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var nuevo = document.adoptNode(doc.documentElement);
    document.replaceChild(nuevo, document.documentElement);
    Array.prototype.slice.call(nuevo.querySelectorAll('script')).forEach(function (viejo) {
      var s = document.createElement('script');
      for (var i = 0; i < viejo.attributes.length; i++) s.setAttribute(viejo.attributes[i].name, viejo.attributes[i].value);
      s.text = viejo.text;
      viejo.parentNode.replaceChild(s, viejo);
    });
  }
  async function abrir(clave) {
    var r = await fetch("propuesta-argos-hdc.bin?v=mwm3uuif", {});
    if (!r.ok) throw new Error('red');
    var d = new Uint8Array(await r.arrayBuffer());
    if (d[0] !== 1) throw new Error('formato');
    var mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
    var llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: d.subarray(1, 17), iterations: 600000, hash: 'SHA-256' }, mat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var p = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.subarray(17, 29) }, llave, d.subarray(29)));
    var n = new DataView(p.buffer).getUint32(0);
    var cab = JSON.parse(new TextDecoder().decode(p.subarray(4, 4 + n)));
    var html = cab.html, ini = 4 + n;
    cab.archivos.forEach(function (a) {
      var u = URL.createObjectURL(new Blob([p.subarray(ini + a.o, ini + a.o + a.l)], { type: a.t }));
      html = html.split(a.p).join(u);
    });
    try { sessionStorage.setItem(K, clave); } catch (x) {}
    mostrar(html);
  }
  f.addEventListener('submit', function (ev) {
    ev.preventDefault(); e.textContent = ''; b.disabled = true; b.textContent = 'Abriendo...';
    abrir(c.value).catch(function (x) {
      b.disabled = false; b.textContent = 'Abrir';
      e.textContent = x && x.name === 'OperationError' ? 'La clave no es correcta.' : 'No se pudo abrir. Revisá la conexión y probá de nuevo.';
      c.select();
    });
  });
  var g = guardada();
  if (g) { b.disabled = true; b.textContent = 'Abriendo...'; abrir(g).catch(function (x) { b.disabled = false; b.textContent = 'Abrir'; if (x && x.name === 'OperationError') { try { sessionStorage.removeItem(K); } catch (y) {} } }); }
})();
</script>
</body>
</html>
